<!doctype html>
<html lang="en">
<head>
  <script src="auth-lock.js"></script>
  <script src="offseason-sc-app/tracking-config.js"></script>
  <script src="site-tracking.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/site-responsive.css">
  <title>Griffin Quizzes | MacEwan Griffins Coaching Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --maroon: #98002e;
      --maroon-light: #b30036;
      --gold: #d1ad7d;
      --gold-soft: rgba(209, 173, 125, 0.14);
      --bg: #0f1219;
      --card: #181d28;
      --card-2: #1f2533;
      --line: rgba(209, 173, 125, 0.22);
      --text: #f3f4f6;
      --mute: #9ca3af;
      --good: #2ecc71;
      --good-soft: rgba(46, 204, 113, 0.14);
      --bad: #ff5e5e;
      --bad-soft: rgba(255, 94, 94, 0.13);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body { font-family: Inter, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; line-height: 1.45; }
    a { color: var(--gold); }
    .wrap { max-width: 860px; margin: 0 auto; padding: 18px 16px 60px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .topbar a { text-decoration: none; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; min-height: 44px; }
    .who { font-size: 13px; color: var(--mute); }
    h1 { font-family: Montserrat, sans-serif; font-size: 26px; margin: 4px 0 4px; letter-spacing: -0.01em; }
    h1 span { color: var(--gold); }
    .sub { color: var(--mute); margin: 0 0 18px; }
    h2 { font-family: Montserrat, sans-serif; font-size: 17px; margin: 0 0 10px; }
    h3 { font-size: 15px; margin: 0 0 6px; }

    .tabs { display: flex; flex-wrap: wrap; gap: 0 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
    .tabs button { background: none; border: none; color: var(--mute); font: 600 14px Inter, sans-serif; padding: 12px 14px; min-height: 44px; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
    .tabs button.active { color: var(--text); border-bottom-color: var(--gold); }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
    .assigned { border-color: var(--gold); background: linear-gradient(180deg, rgba(209,173,125,0.10), var(--card)); }
    .assigned .label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
    .field { display: flex; flex-direction: column; gap: 6px; flex: 1 1 200px; min-width: 0; }
    label.lbl { font-size: 12px; font-weight: 600; color: var(--mute); text-transform: uppercase; letter-spacing: 0.06em; }
    select, input[type=password], input[type=text] { width: 100%; background: var(--card-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px; font: 16px Inter, sans-serif; min-height: 44px; }
    .seg { display: flex; gap: 6px; flex-wrap: wrap; }
    .seg button { flex: 1 1 auto; background: var(--card-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: 600 14px Inter, sans-serif; min-height: 44px; cursor: pointer; }
    .seg button.on { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }
    .btn { background: var(--maroon); color: #fff; border: none; border-radius: 8px; padding: 12px 18px; font: 700 15px Inter, sans-serif; min-height: 44px; cursor: pointer; }
    .btn:hover { background: var(--maroon-light); }
    .btn:disabled { opacity: 0.55; cursor: wait; }
    .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
    .btn.small { padding: 8px 12px; font-size: 13px; min-height: 36px; }
    .note { font-size: 13px; color: var(--mute); margin: 8px 0 0; }
    .err { color: var(--bad); font-size: 14px; margin-top: 10px; }

    /* Quiz */
    .progress { height: 6px; background: var(--card-2); border-radius: 3px; overflow: hidden; margin: 6px 0 16px; }
    .progress div { height: 100%; background: var(--gold); width: 0; transition: width 0.25s; }
    .qmeta { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--mute); }
    .chip { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold); background: var(--gold-soft); border-radius: 999px; padding: 3px 10px; }
    .qtext { font-size: 18px; font-weight: 600; margin: 12px 0 6px; overflow-wrap: anywhere; }
    .quote { font-size: 15px; font-weight: 400; color: #d6d8dd; border-left: 3px solid var(--gold); padding: 6px 0 6px 12px; margin: 10px 0 4px; font-style: italic; overflow-wrap: anywhere; }
    .opts { display: grid; gap: 10px; margin-top: 14px; }
    .opt { text-align: left; background: var(--card-2); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px; font: 500 15px Inter, sans-serif; cursor: pointer; min-height: 48px; overflow-wrap: anywhere; }
    .opt:hover:not(:disabled) { border-color: var(--gold); }
    .opt:disabled { cursor: default; }
    .opt.right { border-color: var(--good); background: var(--good-soft); }
    .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
    .feedback { margin-top: 14px; font-weight: 600; }
    .feedback.good { color: var(--good); }
    .feedback.bad { color: var(--bad); }
    .next { margin-top: 14px; width: 100%; }

    .score-big { font-family: Montserrat, sans-serif; font-size: 44px; font-weight: 800; margin: 4px 0; }
    .review li { margin-bottom: 10px; }
    .review .ans { font-size: 13px; color: var(--mute); }
    .review .ans b { color: var(--text); }
    ul.review { padding-left: 18px; }

    /* Grades */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .stat { background: var(--card-2); border-radius: 10px; padding: 12px; }
    .stat .v { font-family: Montserrat, sans-serif; font-size: 22px; font-weight: 800; }
    .stat .k { font-size: 12px; color: var(--mute); }
    .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid rgba(255,255,255,0.07); vertical-align: top; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--mute); font-weight: 600; white-space: nowrap; }
    tr.attempt { cursor: pointer; }
    tr.attempt:hover td { background: rgba(255,255,255,0.03); }
    .pct { display: inline-block; min-width: 52px; text-align: center; font-weight: 700; border-radius: 6px; padding: 2px 6px; }
    .pct.hi { background: var(--good-soft); color: var(--good); }
    .pct.mid { background: var(--gold-soft); color: var(--gold); }
    .pct.lo { background: var(--bad-soft); color: var(--bad); }
    .detail td { background: rgba(0,0,0,0.18); }
    .detail ol { margin: 4px 0; padding-left: 20px; }
    .detail li { margin-bottom: 6px; font-size: 13px; }
    .ok { color: var(--good); font-weight: 700; }
    .no { color: var(--bad); font-weight: 700; }
    .muted { color: var(--mute); }
    .loading { color: var(--mute); padding: 20px 0; }
    .hidden { display: none !important; }

    @media (max-width: 560px) {
      h1 { font-size: 22px; }
      .card { padding: 14px; }
      .qtext { font-size: 17px; }
      .hide-sm { display: none; }
    }

    /* Tag chips */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip-btn { background: var(--card-2); color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 8px 13px; font: 600 13px Inter, sans-serif; min-height: 38px; cursor: pointer; }
    .chip-btn.on { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }
    .chip-btn small { color: var(--mute); font-weight: 500; margin-left: 4px; }
    .tagline-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .tg { font-size: 11px; font-weight: 600; color: var(--mute); background: rgba(255,255,255,0.06); border-radius: 999px; padding: 2px 8px; }

    /* Staff tools on a question */
    .qtools { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

    /* Bank list */
    .bank-item { border-top: 1px solid rgba(255,255,255,0.07); padding: 12px 0; }
    .bank-item:first-child { border-top: 0; }
    .bank-item .qq { font-weight: 600; overflow-wrap: anywhere; }
    .bank-item .aa { font-size: 13px; color: var(--mute); margin-top: 3px; overflow-wrap: anywhere; }
    .bank-item .aa b { color: var(--good); font-weight: 600; }
    .bank-item .acts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .origin { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gold); }

    /* Modal */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 24px 12px; overflow-y: auto; }
    .modal { background: var(--card); border: 1px solid var(--line); border-radius: 14px; width: 100%; max-width: 620px; padding: 18px; }
    .modal h2 { margin-bottom: 12px; }
    .modal .field { margin-bottom: 12px; flex: none; }
    textarea { width: 100%; background: var(--card-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: 15px Inter, sans-serif; min-height: 64px; resize: vertical; }
    .right-in { border-color: rgba(46,204,113,0.6) !important; }

    /* Completion */
    .done-yes { color: var(--good); font-weight: 700; }
    .done-no { color: var(--bad); font-weight: 700; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="index.html">🏠 Coaching Hub</a>
    <span class="who" id="who"></span>
  </div>
  <h1>Griffin <span>Quizzes</span></h1>
  <p class="sub">Random questions from our scout cards, scouting reports, Griffin Concepts and the coaches' question bank.</p>

  <div class="tabs" id="tabs"></div>
  <main id="view"></main>
</div>

<script src="quiz-data.js"></script>
<script>
(function () {
  'use strict';
  const G = window.GriffinData;
  const { TEAMS, TAGS, teamBySlug, esc, squash, norm } = G;
  const ASSIGN_KEY = 'quiz_assignment';
  const PENDING_KEY = 'griffin-quiz:pending';
  const HISTORY_KEY = 'griffin-quiz:history';

  const isStaff = typeof window.isCoachOrAdmin === 'function' ? window.isCoachOrAdmin() : false;
  const isAdmin = typeof window.isAdminOnly === 'function' ? window.isAdminOnly() : false;
  const toSlug = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const me = (() => {
    if (isStaff) return { name: isAdmin ? 'Admin' : 'Coach', slug: '' };
    let name = '', slug = '';
    try { name = sessionStorage.getItem('hoops-hub:tracking-player-name') || ''; } catch (e) {}
    try { slug = localStorage.getItem('hoops-offseason:current-player') || ''; } catch (e) {}
    if (!name && slug) name = slug.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    return { name: name || 'Player', slug: slug || toSlug(name) };
  })();

  const $ = (sel, root) => (root || document).querySelector(sel);
  const view = $('#view');
  const readJSON = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
  const writeJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const fmtDate = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); };
  const pctClass = p => p >= 80 ? 'hi' : p >= 60 ? 'mid' : 'lo';
  const nice = t => t.replace(/\b\w/g, c => c.toUpperCase()).replace(/^Pnr$/, 'PNR').replace(/^Dho$/, 'DHO');
  const tagLabel = t => teamBySlug(t) ? teamBySlug(t).title : nice(t);
  const tagChips = tags => (tags || []).length ? `<div class="tagline-chips">${tags.map(t => `<span class="tg">${esc(tagLabel(t))}</span>`).join('')}</div>` : '';

  // ------------------------------------------------------------- modals ---
  function modal(html) {
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
    document.body.appendChild(bg);
    bg.addEventListener('click', e => { if (e.target === bg) bg.remove(); });
    return bg;
  }

  // Staff-only changes need the signed staff pass; ask for the password once.
  function ensureStaff(message) {
    if (G.staffToken()) return Promise.resolve(true);
    const role = isAdmin ? 'admin' : 'coach';
    return new Promise(resolve => {
      const m = modal(`<h2>Confirm it's you</h2>
        <p class="muted" style="margin-top:0">${esc(message || 'Enter your ' + role + ' password once (you stay signed in until you close this tab).')}</p>
        <form id="pwForm"><div class="field"><input type="password" id="pw" autocomplete="current-password" placeholder="${role === 'admin' ? 'Admin' : 'Coach'} password" required></div>
        <div class="row"><button class="btn" type="submit">Continue</button><button class="btn ghost" type="button" id="pwCancel">Cancel</button></div></form>
        <div class="err" id="pwErr"></div>`);
      $('#pw', m).focus();
      $('#pwCancel', m).onclick = () => { m.remove(); resolve(false); };
      $('#pwForm', m).onsubmit = async e => {
        e.preventDefault();
        const btn = $('#pwForm button', m); btn.disabled = true;
        try {
          const r = await fetch('/.netlify/functions/verify-access', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ role, password: $('#pw', m).value }) });
          const d = await r.json().catch(() => ({}));
          if (d.ok && d.token) { sessionStorage.setItem('griffin_staff_token', d.token); m.remove(); resolve(true); }
          else { $('#pwErr', m).textContent = d.message || 'That password did not work.'; btn.disabled = false; }
        } catch (err) { $('#pwErr', m).textContent = 'Could not reach the server.'; btn.disabled = false; }
      };
    });
  }

  async function staffWrite(body) {
    if (!(await ensureStaff())) throw new Error('cancelled');
    try { return await G.bankWrite(body); }
    catch (e) {
      if (e.status === 401 && (await ensureStaff('Your staff sign-in expired. Enter your password again.'))) return G.bankWrite(body);
      throw e;
    }
  }

  // Question editor. `start` is a bank question, an automatic question being
  // copied into the bank (it is then hidden), or empty for a new question.
  function openEditor(start, onSaved) {
    const s = start || {};
    const wrong = (s.wrong || (s.options ? s.options.filter(o => o !== s.answer) : [])).slice(0, 3);
    while (wrong.length < 3) wrong.push('');
    let tags = (s.tags || []).slice();
    const isAuto = s.key && !s.bankId && !s.id;
    const m = modal(`<h2>${s.id || s.bankId ? 'Edit question' : isAuto ? 'Edit this question (saves a copy to the bank)' : 'New question'}</h2>
      ${isAuto ? '<p class="note" style="margin-top:-6px">This question was made automatically. Saving puts your version in the question bank and hides the automatic one.</p>' : ''}
      <div class="field"><label class="lbl" for="eQ">Question</label><textarea id="eQ" maxlength="400">${esc(s.q || '')}</textarea></div>
      <div class="field"><label class="lbl" for="eQuote">Extra context shown under the question (optional)</label><textarea id="eQuote" maxlength="600" placeholder="e.g. a quote from the scouting note">${esc(s.quote || '')}</textarea></div>
      <div class="field"><label class="lbl" for="eA">Right answer</label><input type="text" id="eA" class="right-in" maxlength="300" value="${esc(s.answer || '')}"></div>
      ${wrong.map((w, i) => `<div class="field"><label class="lbl" for="eW${i}">Wrong answer ${i + 1}${i ? ' (optional)' : ''}</label><input type="text" id="eW${i}" maxlength="300" value="${esc(w)}"></div>`).join('')}
      <div class="field"><label class="lbl">Tags (pick at least one)</label><div class="chips" id="eTags"></div>
        <div class="row" style="margin-top:8px"><div class="field" style="margin:0"><input type="text" id="eNewTag" placeholder="Add your own tag, or a team (e.g. calgary-dinos)" list="tagList"></div><button class="btn ghost small" type="button" id="eAddTag">Add tag</button></div>
        <datalist id="tagList">${TAGS.concat(TEAMS.map(t => t.slug)).map(t => `<option value="${esc(t)}">`).join('')}</datalist>
        <p class="note">Tag a team (its name, e.g. "calgary-dinos") to put the question in that team's scouting quiz.</p></div>
      <div class="field"><label class="lbl" for="eX">Why it's right (optional, shown after answering)</label><input type="text" id="eX" maxlength="400" value="${esc(s.explain || '')}"></div>
      <div class="row"><button class="btn" id="eSave">Save question</button><button class="btn ghost" id="eCancel">Cancel</button></div>
      <div class="err" id="eErr"></div>`);
    const drawTags = () => {
      const all = [...new Set(TAGS.concat(tags))];
      $('#eTags', m).innerHTML = all.map(t => `<button type="button" class="chip-btn ${tags.indexOf(t) >= 0 ? 'on' : ''}" data-t="${esc(t)}">${esc(tagLabel(t))}</button>`).join('');
      m.querySelectorAll('#eTags .chip-btn').forEach(b => b.onclick = () => {
        const t = b.dataset.t;
        tags = tags.indexOf(t) >= 0 ? tags.filter(x => x !== t) : tags.concat(t);
        drawTags();
      });
    };
    drawTags();
    $('#eAddTag', m).onclick = () => {
      const t = squash($('#eNewTag', m).value).toLowerCase();
      if (t && tags.indexOf(t) < 0) tags.push(t);
      $('#eNewTag', m).value = '';
      drawTags();
    };
    $('#eCancel', m).onclick = () => m.remove();
    $('#eSave', m).onclick = async () => {
      const q = {
        id: s.id || s.bankId || '',
        q: $('#eQ', m).value, quote: $('#eQuote', m).value, answer: $('#eA', m).value,
        wrong: [0, 1, 2].map(i => $('#eW' + i, m).value).filter(v => squash(v)),
        tags, explain: $('#eX', m).value, by: me.name
      };
      const err = $('#eErr', m);
      if (!squash(q.q) || !squash(q.answer) || !q.wrong.length) { err.textContent = 'Fill in the question, the right answer and at least one wrong answer.'; return; }
      if (!tags.length) { err.textContent = 'Pick at least one tag.'; return; }
      const btn = $('#eSave', m); btn.disabled = true; btn.textContent = 'Saving…';
      try {
        const d = await staffWrite({ action: 'save', question: q });
        if (isAuto) await staffWrite({ action: 'hide', key: s.key, q: s.q + (s.quote ? ' “' + s.quote + '”' : '') });
        m.remove();
        toast('✓ Saved to the question bank');
        if (onSaved) onSaved(d.question);
      } catch (e) {
        btn.disabled = false; btn.textContent = 'Save question';
        if (e.message !== 'cancelled') err.textContent = e.message;
      }
    };
  }

  function toast(msg) {
    const t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;border:1px solid var(--gold);color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-weight:600;font-size:14px;max-width:90vw;text-align:center';
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2600);
  }

  async function hideQuestion(q) {
    if (!confirm('Hide this question? It will stop showing up in quizzes. You can bring it back from the Question bank tab.')) return false;
    try {
      if (q.bankId) await staffWrite({ action: 'delete', id: q.bankId });
      else await staffWrite({ action: 'hide', key: q.key, q: q.q + (q.quote ? ' “' + q.quote + '”' : '') });
      toast(q.bankId ? '✓ Question deleted from the bank' : '✓ Question hidden');
      return true;
    } catch (e) { if (e.message !== 'cancelled') alert(e.message); return false; }
  }

  // ------------------------------------------------------------ results ---
  async function submitResult(result) {
    const r = await fetch('/.netlify/functions/quiz-results', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'submit', result })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.success) throw new Error(d.message || 'Could not save.');
    return d;
  }
  async function flushPending() {
    const pending = readJSON(PENDING_KEY, []);
    if (!pending.length) return;
    const left = [];
    for (const p of pending) { try { await submitResult(p); } catch (e) { left.push(p); } }
    writeJSON(PENDING_KEY, left);
  }

  // --------------------------------------------------------------- tabs ---
  let assignment = null;
  async function loadAssignment() {
    const raw = await G.getContent(ASSIGN_KEY);
    try { assignment = raw ? JSON.parse(raw) : null; } catch (e) { assignment = null; }
    return assignment;
  }

  const TABS = isStaff
    ? [['grades', 'Grades'], ['bank', 'Question bank'], ['assign', 'Set team quiz'], ['take', 'Try a quiz']]
    : [['take', 'Take a quiz'], ['mine', 'My results']];

  function renderTabs(active) {
    $('#tabs').innerHTML = TABS.map(([id, label]) => `<button data-tab="${id}" class="${id === active ? 'active' : ''}">${label}</button>`).join('');
    $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => go(b.dataset.tab));
  }

  let quizRunning = false;
  function go(tab) {
    if (quizRunning && !confirm('Leave this quiz? Your answers so far will be lost.')) return;
    quizRunning = false;
    renderTabs(tab);
    ({ take: viewTake, mine: viewMine, grades: viewGrades, assign: viewAssign, bank: viewBank })[tab]();
    window.scrollTo(0, 0);
  }

  const teamOptions = selected => TEAMS.map(t => `<option value="${t.slug}" ${t.slug === selected ? 'selected' : ''}>${esc(t.title)}</option>`).join('');

  // Tag chips with question counts, for picking a Concepts & topics quiz.
  async function tagPicker(box, selected, onChange) {
    box.innerHTML = '<span class="muted">Loading topics…</span>';
    const pool = await G.topicPool();
    const counts = {};
    pool.forEach(q => (q.tags || []).forEach(t => { counts[t] = (counts[t] || 0) + 1; }));
    const tags = TAGS.filter(t => counts[t]).concat(Object.keys(counts).filter(t => TAGS.indexOf(t) < 0 && !teamBySlug(t)).sort());
    let sel = selected.slice();
    const draw = () => {
      const n = pool.filter(q => G.hasAnyTag(q, sel)).length;
      box.innerHTML = `<div class="chips">
        <button type="button" class="chip-btn ${!sel.length ? 'on' : ''}" data-t="">Everything<small>${pool.length}</small></button>
        ${tags.map(t => `<button type="button" class="chip-btn ${sel.indexOf(t) >= 0 ? 'on' : ''}" data-t="${esc(t)}">${esc(nice(t))}<small>${counts[t]}</small></button>`).join('')}
      </div><p class="note">${sel.length ? `${n} questions match (any of the picked tags).` : 'All Concepts questions.'}</p>`;
      box.querySelectorAll('.chip-btn').forEach(b => b.onclick = () => {
        const t = b.dataset.t;
        sel = !t ? [] : sel.indexOf(t) >= 0 ? sel.filter(x => x !== t) : sel.concat(t);
        draw();
        onChange(sel);
      });
    };
    draw();
    onChange(sel);
  }

  async function start(cfg) {
    view.innerHTML = `<div class="card loading">Building your quiz…</div>`;
    try {
      const n = Math.max(5, Math.min(30, cfg.length || 10));
      const quiz = cfg.type === 'scout' ? await G.buildScoutQuiz(cfg.team, n) : await G.buildTopicQuiz(cfg.tags || G.assignmentTags(cfg), n);
      if (quiz.questions.length < 3) throw new Error('There aren\'t enough questions for this yet. Try other topics or another team.');
      runQuiz(quiz, cfg);
    } catch (e) {
      view.innerHTML = `<div class="card"><p class="err">${esc(e.message || 'Something went wrong building the quiz.')}</p><button class="btn ghost" id="back">Back</button></div>`;
      $('#back').onclick = () => go('take');
    }
  }

  function runQuiz(quiz, cfg) {
    quizRunning = true;
    const answers = [];
    const startedAt = new Date().toISOString();
    let i = 0;
    const show = () => {
      const q = quiz.questions[i];
      view.innerHTML = `
        <div class="card">
          <div class="qmeta"><span>${esc(quiz.title)}</span><span>${i + 1} / ${quiz.questions.length}</span></div>
          <div class="progress"><div style="width:${(i / quiz.questions.length) * 100}%"></div></div>
          <span class="chip">${esc(q.source)}</span>
          <div class="qtext">${esc(q.q)}</div>
          ${q.quote ? `<div class="quote">“${esc(q.quote)}”</div>` : ''}
          <div class="opts">${q.options.map((o, k) => `<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div>
          <div id="fb"></div>
          ${isStaff ? `<div class="qtools"><button class="btn ghost small" id="qEdit">✎ Edit this question</button><button class="btn ghost small" id="qHide">${q.bankId ? '🗑 Delete from bank' : '🙈 Hide this question'}</button></div>${tagChips(q.tags)}` : ''}
        </div>`;
      if (isStaff) {
        $('#qEdit').onclick = () => openEditor(q, saved => { Object.assign(q, G.fromBank(saved)); show(); });
        $('#qHide').onclick = async () => { if (await hideQuestion(q)) { $('#qHide').disabled = true; $('#qHide').textContent = q.bankId ? 'Deleted' : 'Hidden'; } };
      }
      view.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        const chosen = q.options[+b.dataset.k];
        const ok = chosen === q.answer;
        answers.push({ q: q.q + (q.quote ? ` “${q.quote}”` : ''), source: q.source, chosen, correct: q.answer, ok });
        view.querySelectorAll('.opt').forEach(x => {
          x.disabled = true;
          const v = q.options[+x.dataset.k];
          if (v === q.answer) x.classList.add('right');
          else if (x === b) x.classList.add('wrong');
        });
        const last = i === quiz.questions.length - 1;
        $('#fb').innerHTML = `<div class="feedback ${ok ? 'good' : 'bad'}">${ok ? '✓ Correct' : '✗ Not quite. Answer: ' + esc(q.answer)}${q.explain ? `<span class="muted" style="font-weight:400"> (${esc(q.explain)})</span>` : ''}</div>
          <button class="btn next" id="next">${last ? 'See my score' : 'Next question ➔'}</button>`;
        $('#next').onclick = () => { if (last) finish(); else { i++; show(); window.scrollTo(0, 0); } };
        $('#next').focus({ preventScroll: true });
      });
    };
    const finish = async () => {
      quizRunning = false;
      const score = answers.filter(a => a.ok).length;
      const total = answers.length;
      const pct = Math.round((100 * score) / total);
      const result = { player: me.name, playerSlug: me.slug, quizType: quiz.quizType, quizKey: quiz.quizKey, quizTitle: quiz.title, score, total, startedAt, questions: answers };
      const missed = answers.filter(a => !a.ok);
      view.innerHTML = `
        <div class="card" style="text-align:center">
          <div class="muted">${esc(quiz.title)}</div>
          <div class="score-big">${score} / ${total}</div>
          <span class="pct ${pctClass(pct)}">${pct}%</span>
          <p class="note" id="saveState">${isStaff ? 'Staff preview: not saved.' : 'Saving your result…'}</p>
          <div class="row" style="justify-content:center;margin-top:12px">
            <button class="btn" id="again">Take it again (new questions)</button>
            <button class="btn ghost" id="other">Pick another quiz</button>
          </div>
        </div>
        ${missed.length ? `<div class="card"><h2>Review what you missed</h2><ul class="review">${missed.map(a => `<li>${esc(a.q)}<div class="ans">You said: ${esc(a.chosen)} · Answer: <b>${esc(a.correct)}</b></div></li>`).join('')}</ul></div>` : '<div class="card"><h2>Perfect score 🔥</h2><p class="muted">You know this one cold.</p></div>'}`;
      $('#again').onclick = () => start(Object.assign({}, cfg, { length: total }));
      $('#other').onclick = () => go('take');
      if (isStaff) return;
      const hist = readJSON(HISTORY_KEY, []);
      hist.unshift({ quizTitle: quiz.title, score, total, at: new Date().toISOString(), player: me.slug });
      writeJSON(HISTORY_KEY, hist.slice(0, 50));
      try {
        await submitResult(result);
        $('#saveState').textContent = '✓ Saved. Your coaches can see this result.';
      } catch (e) {
        const pending = readJSON(PENDING_KEY, []);
        pending.push(result);
        writeJSON(PENDING_KEY, pending);
        $('#saveState').textContent = 'No connection right now: your result is saved on this phone and will be sent next time you open Griffin Quizzes.';
      }
    };
    show();
  }

  function viewMine() {
    const hist = readJSON(HISTORY_KEY, []).filter(h => !h.player || h.player === me.slug);
    view.innerHTML = `<div class="card"><h2>My results on this device</h2>
      ${hist.length ? `<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Quiz</th><th>Score</th></tr></thead><tbody>
      ${hist.map(h => { const p = Math.round(100 * h.score / h.total); return `<tr><td>${esc(fmtDate(h.at))}</td><td>${esc(h.quizTitle)}</td><td><span class="pct ${pctClass(p)}">${h.score}/${h.total}</span></td></tr>`; }).join('')}
      </tbody></table></div>` : '<p class="muted">No quizzes yet. Take one from the "Take a quiz" tab.</p>'}
      <p class="note">Coaches see every result you finish, from any device.</p></div>`;
  }

  // ------------------------------------------------------ staff: grades ---
  async function loadRosterNames() {
    try {

        const d = await (await fetch(url + '?action=getRoster')).json();
        if (Array.isArray(d) && d.length) return d.map(p => p.name).filter(Boolean);

    try {

      return ((s.macewan && s.macewan.roster) || []).map(p => p.name).filter(Boolean);

  let allResults = [];
  async function viewGrades() {
    if (!G.staffToken()) {
      view.innerHTML = `<div class="card"><h2>Grades are for staff only</h2><p class="muted">Enter your password once to open them (you stay signed in until you close this tab).</p><button class="btn" id="unlock">Open grades</button></div>`;
      $('#unlock').onclick = async () => { if (await ensureStaff()) viewGrades(); };
      return;
    }
    view.innerHTML = '<div class="card loading">Loading grades…</div>';
    let roster = [];
    try {
      const [r, names] = await Promise.all([fetch('/.netlify/functions/quiz-results', { headers: { 'X-Staff-Token': G.staffToken() } }), loadRosterNames()]);
      roster = names;
      if (r.status === 401) { sessionStorage.removeItem('griffin_staff_token'); return viewGrades(); }
      allResults = (await r.json()).results || [];
    } catch (e) {
      view.innerHTML = '<div class="card"><p class="err">Could not load grades. Check your connection and try again.</p></div>';
      return;
    }
    const quizzes = [...new Set(allResults.map(r => r.quizTitle))].sort();
    const players = [...new Set(allResults.map(r => r.player))].sort();
    view.innerHTML = `
      <div id="completion"></div>
      <div class="card">
        <div class="row">
          <div class="field"><label class="lbl" for="fQuiz">Quiz</label><select id="fQuiz"><option value="">All quizzes</option>${quizzes.map(q => `<option>${esc(q)}</option>`).join('')}</select></div>
          <div class="field"><label class="lbl" for="fPlayer">Player</label><select id="fPlayer"><option value="">All players</option>${players.map(p => `<option>${esc(p)}</option>`).join('')}</select></div>
        </div>
      </div>
      <div id="gradesBody"></div>`;
    drawCompletion(roster);
    $('#fQuiz').onchange = $('#fPlayer').onchange = drawGrades;
    drawGrades();
  }

  // Who has / hasn't done the assigned quiz since it was assigned.
  function drawCompletion(roster) {
    const box = $('#completion');
    const a = assignment;
    if (!a) { box.innerHTML = `<div class="card"><h2>Assigned quiz</h2><p class="muted" style="margin:0">No team quiz is assigned. Use "Set team quiz" to give the team one, then check here who has done it.</p></div>`; return; }
    const key = G.assignmentKey(a);
    const since = a.setAt || '';
    const done = {};
    allResults.forEach(r => {
      if (r.quizKey !== key || (since && r.finishedAt < since)) return;
      const k = norm(r.player);
      const p = Math.round(100 * r.score / r.total);
      const d = done[k] || (done[k] = { best: 0, n: 0, last: r.finishedAt });
      d.best = Math.max(d.best, p); d.n++;
    });
    const names = [...new Set(roster.concat(allResults.filter(r => r.quizKey === key && (!since || r.finishedAt >= since)).map(r => r.player)))];
    const rows = names.map(n => ({ n, d: done[norm(n)] })).sort((x, y) => (!!y.d - !!x.d) || x.n.localeCompare(y.n));
    const count = rows.filter(r => r.d).length;
    box.innerHTML = `<div class="card assigned">
      <div class="label">Assigned quiz</div>
      <h2 style="margin:6px 0 2px">${esc(G.assignmentTitle(a))}</h2>
      <p class="note" style="margin:0 0 10px">Assigned ${esc(fmtDate(since))} · <b style="color:var(--text)">${count} of ${rows.length}</b> players done</p>
      <div class="tbl-wrap"><table><thead><tr><th>Player</th><th>Done?</th><th>Best</th><th>Tries</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td>${esc(r.n)}</td><td>${r.d ? '<span class="done-yes">✓ Done</span>' : '<span class="done-no">Not yet</span>'}</td><td>${r.d ? `<span class="pct ${pctClass(r.d.best)}">${r.d.best}%</span>` : ''}</td><td>${r.d ? r.d.n : ''}</td></tr>`).join('')}
      </tbody></table></div></div>`;
  }

  function drawGrades() {
    const fq = $('#fQuiz').value, fp = $('#fPlayer').value;
    const rows = allResults.filter(r => (!fq || r.quizTitle === fq) && (!fp || r.player === fp));
    const body = $('#gradesBody');
    if (!rows.length) { body.innerHTML = '<div class="card"><p class="muted">No results yet. Once players finish a quiz, their grades show up here.</p></div>'; return; }
    const avg = list => Math.round(list.reduce((s, r) => s + 100 * r.score / r.total, 0) / list.length);
    const byPlayer = {};
    rows.forEach(r => (byPlayer[r.player] = byPlayer[r.player] || []).push(r));
    const summary = Object.entries(byPlayer).map(([p, list]) => ({
      p, n: list.length, avg: avg(list), best: Math.max(...list.map(r => Math.round(100 * r.score / r.total))), latest: list[0]
    })).sort((a, b) => b.avg - a.avg);
    body.innerHTML = `
      <div class="stats">
        <div class="stat"><div class="v">${rows.length}</div><div class="k">quizzes taken</div></div>
        <div class="stat"><div class="v">${summary.length}</div><div class="k">players</div></div>
        <div class="stat"><div class="v">${avg(rows)}%</div><div class="k">average score</div></div>
      </div>
      <div class="card"><h2>By player</h2><div class="tbl-wrap"><table>
        <thead><tr><th>Player</th><th>Taken</th><th>Average</th><th>Best</th><th class="hide-sm">Latest</th></tr></thead><tbody>
        ${summary.map(s => { const lp = Math.round(100 * s.latest.score / s.latest.total); return `<tr><td>${esc(s.p)}</td><td>${s.n}</td><td><span class="pct ${pctClass(s.avg)}">${s.avg}%</span></td><td>${s.best}%</td><td class="hide-sm">${lp}% · ${esc(fmtDate(s.latest.finishedAt))}</td></tr>`; }).join('')}
        </tbody></table></div></div>
      <div class="card"><h2>Every attempt</h2><p class="note" style="margin:-4px 0 10px">Tap a row to see each question and answer.</p><div class="tbl-wrap"><table>
        <thead><tr><th>When</th><th>Player</th><th>Quiz</th><th>Score</th><th></th></tr></thead><tbody>
        ${rows.map((r, i) => { const p = Math.round(100 * r.score / r.total); return `<tr class="attempt" data-i="${i}"><td>${esc(fmtDate(r.finishedAt))}</td><td>${esc(r.player)}</td><td>${esc(r.quizTitle)}</td><td><span class="pct ${pctClass(p)}">${r.score}/${r.total}</span></td><td>▾</td></tr>`; }).join('')}
        </tbody></table></div></div>`;
    body.querySelectorAll('tr.attempt').forEach(tr => tr.onclick = () => {
      const next = tr.nextElementSibling;
      if (next && next.classList.contains('detail')) { next.remove(); return; }
      const r = rows[+tr.dataset.i];
      const d = document.createElement('tr');
      d.className = 'detail';
      d.innerHTML = `<td colspan="5"><ol>${(r.questions || []).map(q => `<li><span class="${q.ok ? 'ok' : 'no'}">${q.ok ? '✓' : '✗'}</span> ${esc(q.q)}<br><span class="muted">${q.ok ? 'Answered: ' + esc(q.chosen) : 'Said: ' + esc(q.chosen) + ' · Answer: ' + esc(q.correct)}</span></li>`).join('')}</ol>
        <button class="btn ghost small" data-del="1">Delete this attempt</button></td>`;
      tr.after(d);
      d.querySelector('[data-del]').onclick = async ev => {
        ev.stopPropagation();
        if (!confirm(`Delete ${r.player}'s attempt at "${r.quizTitle}"? This can't be undone.`)) return;
        const res = await fetch('/.netlify/functions/quiz-results', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Staff-Token': G.staffToken() }, body: JSON.stringify({ action: 'delete', id: r.id }) });
        if (res.ok) { allResults = allResults.filter(x => x.id !== r.id); drawGrades(); } else alert('Could not delete. Try signing in again.');
      };
    });
  }

  // ------------------------------------------------- staff: question bank ---
  async function viewBank() {
    view.innerHTML = '<div class="card loading">Loading the question bank…</div>';
    G.forget('bank');
    let bank, auto;
    try {
      [bank, auto] = await Promise.all([G.loadBank(), G.conceptQuestions().catch(() => [])]);
    } catch (e) {
      view.innerHTML = '<div class="card"><p class="err">Could not load the question bank.</p></div>';
      return;
    }
    const bankQs = bank.questions.slice().sort((a, b) => String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')) || a.id.localeCompare(b.id));
    const autoQs = auto.filter(q => !bank.hidden[q.key]);
    const hiddenList = Object.values(bank.hidden);
    const allTags = [...new Set([].concat(...bankQs.map(q => q.tags || []), ...autoQs.map(q => q.tags || [])))].sort();
    view.innerHTML = `
      <div class="card">
        <div class="row" style="justify-content:space-between;align-items:center">
          <h2 style="margin:0">Question bank</h2>
          <button class="btn" id="newQ">+ New question</button>
        </div>
        <p class="muted" style="margin:8px 0 12px">Your own questions plus the starter set. Tags decide which quizzes a question shows up in (tag a team like "calgary-dinos" to add it to that team's scouting quiz).</p>
        <div class="row">
          <div class="field"><label class="lbl" for="bSrc">Show</label><select id="bSrc">
            <option value="bank">Question bank (${bankQs.length})</option>
            <option value="auto">Automatic Concepts questions (${autoQs.length})</option>
            <option value="hidden">Hidden questions (${hiddenList.length})</option></select></div>
          <div class="field"><label class="lbl" for="bTag">Tag</label><select id="bTag"><option value="">All tags</option>${allTags.map(t => `<option value="${esc(t)}">${esc(tagLabel(t))}</option>`).join('')}</select></div>
          <div class="field"><label class="lbl" for="bFind">Search</label><input type="text" id="bFind" placeholder="Word in the question or answer"></div>
        </div>
      </div>
      <div class="card" id="bList"></div>`;
    $('#newQ').onclick = () => openEditor({ tags: [] }, () => viewBank());
    const draw = () => {
      const src = $('#bSrc').value, tag = $('#bTag').value, find = norm($('#bFind').value);
      const match = (q, a) => (!tag || (q.tags || []).indexOf(tag) >= 0) && (!find || norm(q.q + ' ' + (q.quote || '') + ' ' + a).indexOf(find) >= 0);
      const list = $('#bList');
      if (src === 'hidden') {
        const items = hiddenList.filter(h => !find || norm(h.q).indexOf(find) >= 0);
        list.innerHTML = items.length ? items.map(h => `<div class="bank-item"><div class="qq">${esc(h.q)}</div><div class="aa">Hidden ${esc(fmtDate(h.at))}</div>
          <div class="acts"><button class="btn ghost small" data-unhide="${esc(h.key)}">Show it again</button></div></div>`).join('') : '<p class="muted">Nothing hidden.</p>';
        list.querySelectorAll('[data-unhide]').forEach(b => b.onclick = async () => {
          try { await staffWrite({ action: 'unhide', key: b.dataset.unhide }); toast('✓ It will show up in quizzes again'); viewBank(); } catch (e) { if (e.message !== 'cancelled') alert(e.message); }
        });
        return;
      }
      const items = src === 'bank'
        ? bankQs.filter(q => match(q, q.answer + ' ' + (q.wrong || []).join(' '))).map(q => ({ q, kind: 'bank' }))
        : autoQs.filter(q => match(q, q.answer)).map(q => ({ q, kind: 'auto' }));
      list.innerHTML = items.length ? items.slice(0, 300).map(({ q, kind }, i) => `<div class="bank-item">
          ${kind === 'bank' ? `<div class="origin">${q.origin === 'coach' ? 'Coach question' : 'Starter question'}${q.by ? ' · ' + esc(q.by) : ''}</div>` : `<div class="origin">${esc(q.source)}</div>`}
          <div class="qq">${esc(q.q)}</div>
          ${q.quote ? `<div class="aa">“${esc(q.quote)}”</div>` : ''}
          <div class="aa">Answer: <b>${esc(q.answer)}</b>${kind === 'bank' ? ` · Wrong: ${esc((q.wrong || []).join(' / '))}` : ''}</div>
          ${tagChips(q.tags)}
          <div class="acts"><button class="btn ghost small" data-edit="${i}">✎ Edit</button><button class="btn ghost small" data-del="${i}">${kind === 'bank' ? '🗑 Delete' : '🙈 Hide'}</button></div>
        </div>`).join('') + (items.length > 300 ? `<p class="note">Showing 300 of ${items.length}. Use a tag or search to narrow it down.</p>` : '') : '<p class="muted">No questions match.</p>';
      list.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
        const it = items[+b.dataset.edit];
        openEditor(it.kind === 'bank' ? it.q : it.q, () => viewBank());
      });
      list.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
        const it = items[+b.dataset.del];
        if (it.kind === 'bank') {
          if (!confirm('Delete this question from the bank?')) return;
          try { await staffWrite({ action: 'delete', id: it.q.id }); toast('✓ Deleted'); viewBank(); } catch (e) { if (e.message !== 'cancelled') alert(e.message); }
        } else if (await hideQuestion(it.q)) viewBank();
      });
    };
    $('#bSrc').onchange = $('#bTag').onchange = draw;
    $('#bFind').oninput = draw;
    draw();
  }

  // ------------------------------------------------ staff: assign a quiz ---
  function viewAssign() {
    const a = assignment || { type: 'scout', team: '', length: 10, note: '' };
    view.innerHTML = `<div class="card">
      <h2>Set the team quiz</h2>
      <p class="muted" style="margin-top:0">Players see this quiz at the top of their quiz page, and the Grades tab shows who has done it.</p>
      ${assignment ? `<p class="note" style="margin:0 0 12px">Currently assigned: <b style="color:var(--text)">${esc(G.assignmentTitle(assignment))}</b></p>` : ''}
      <div class="seg" id="aType" style="margin-bottom:14px">
        <button data-v="scout">🏀 Scouting report</button>
        <button data-v="topics">📖 Concepts &amp; topics</button>
      </div>
      <div class="field" id="aTeamF"><label class="lbl" for="aTeam">Opponent</label><select id="aTeam">${teamOptions(a.team)}</select></div>
      <div class="field hidden" id="aTagF"><label class="lbl">Topics</label><div id="aTagBox"></div></div>
      <div class="field" style="max-width:160px;margin-top:12px"><label class="lbl" for="aLen">Questions</label><select id="aLen">${[10, 15, 20].map(n => `<option ${n === +a.length ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
      <div class="field" style="margin-top:12px"><label class="lbl" for="aNote">Message to players (optional)</label><input type="text" id="aNote" maxlength="160" value="${esc(a.note || '')}" placeholder="e.g. Due before Thursday's walkthrough"></div>
      <div class="row" style="margin-top:16px">
        <button class="btn" id="aSave">Assign to the team</button>
        ${assignment ? '<button class="btn ghost" id="aClear">Remove assignment</button>' : ''}
      </div>
      <p class="note" id="aState"></p>
    </div>`;
    let type = a.type === 'scout' ? 'scout' : 'topics';
    let tags = G.assignmentTags(a);
    let loaded = false;
    const setType = t => {
      type = t;
      view.querySelectorAll('#aType button').forEach(x => x.classList.toggle('on', x.dataset.v === t));
      $('#aTeamF').classList.toggle('hidden', t !== 'scout');
      $('#aTagF').classList.toggle('hidden', t !== 'topics');
      if (t === 'topics' && !loaded) { loaded = true; tagPicker($('#aTagBox'), tags, s => { tags = s; }); }
    };
    view.querySelectorAll('#aType button').forEach(b => b.onclick = () => setType(b.dataset.v));
    setType(type);
    const save = async value => {
      $('#aState').textContent = 'Saving…';
      try {
        const r = await fetch('/.netlify/functions/save-content', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: ASSIGN_KEY, content: value ? JSON.stringify(value) : '' }) });
        if (!r.ok) throw new Error();
        assignment = value;
        viewAssign();
        $('#aState').textContent = value ? '✓ Assigned. Players will see it next time they open Griffin Quizzes.' : '✓ Assignment removed.';
      } catch (e) { $('#aState').textContent = 'Could not save. Check your connection.'; }
    };
    $('#aSave').onclick = () => save(type === 'scout'
      ? { type: 'scout', team: $('#aTeam').value, length: +$('#aLen').value, note: $('#aNote').value.trim(), setAt: new Date().toISOString() }
      : { type: 'topics', tags, length: +$('#aLen').value, note: $('#aNote').value.trim(), setAt: new Date().toISOString() });
    if ($('#aClear')) $('#aClear').onclick = () => save(null);
  }

  // ----------------------------------------------------------------- go ---
  $('#who').textContent = isStaff ? `Signed in as ${me.name} (staff)` : `Signed in as ${me.name}`;
  window.addEventListener('beforeunload', e => { if (quizRunning) { e.preventDefault(); e.returnValue = ''; } });
  flushPending();
  // Links like quiz.html?team=calgary-dinos&start=1 or quiz.html?tags=pnr,defence
  const params = new URLSearchParams(location.search);
  const pre = params.get('team') ? { type: 'scout', team: params.get('team') } : params.get('tags') ? { type: 'topics', tags: params.get('tags').split(',').map(t => t.trim().toLowerCase()).filter(Boolean) } : null;
  loadAssignment().finally(() => {
    if (pre && params.get('start') === '1') { renderTabs('take'); start(Object.assign({ length: 10 }, pre)); }
    else if (pre) { renderTabs('take'); viewTake(pre); }
    else go(isStaff ? 'grades' : 'take');
  });
})();
</script>
</body>
</html>
