/* ---------- the decision tree ---------- */
/* court tap → (3PT type) → shooter → outcome → contest → (free throws) → play type */
/* One tree for everything that can happen at a spot on the floor. Who had it
   and what happened are always asked; the outcome decides the rest, which is
   why the catch-and-shoot question sits AFTER it — a turnover beyond the arc
   is not a three. */
function steps(d) {
  const S = App.S, out = ["pl", "res"];
  if (d.res === "to") {
    out.push("live");
    if (!S.stickyPT) out.push("pt");
    return out;
  }
  if (d.cls === "three") out.push("st");
  out.push("ct");
  /* Only on their offence: which of ours was guarding. Skippable, and it can
     be turned off entirely in Setup. */
  if (d.team === "them" && S.logDef !== false) out.push("dfn");
  if (!S.stickyPT) out.push("pt");
  /* Free throws come last: everything about the attempt is logged while the
     play is fresh, and the trip is filled in during the dead ball.
     Default on — only an explicit false in Setup turns the question off, so
     settings loaded without the phone defaults don't silently drop it. */
  if (S.logFT !== false && (d.res === "foul" || d.res === "and1")) out.push("ft");
  return out;
}
const tapClock = () => Math.round(clockNow() * 10) / 10;

function startShot(loc) {
  App._allPlayers = false;
  App.wiz = { d: Object.assign({ team: App.team, cAt: tapClock() }, loc) };
  if (App.S.stickyPT) App.wiz.d.pt = App.S.stickyPT;
  nextStep();
}
function nextStep() {
  const w = App.wiz; if (!w) return;
  const list = steps(w.d);
  for (const s of list) if (w.d[s] === undefined) { w.step = s; renderSheet(); return; }
  finish();
}
function setVal(s, v) {
  const w = App.wiz; if (!w) return;
  w.d[s] = v;
  if (s === "res" && !(App.S.logFT !== false && (v === "foul" || v === "and1"))) w.d.ft = null;
  /* Stop the clock the moment the whistle is known, not at the end of the
     tree: the arena clock is already stopped while the rest is filled in. */
  const whistle = (s === "res" && (v === "foul" || v === "and1")) ||
                  (s === "live" && (v === "dead" || v === "off"));
  if (whistle) {
    if (stopAtWhistle(w.d.cAt != null ? w.d.cAt : tapClock())) w.stopped = true;
    renderBar();
  }
  nextStep();
}
function back() {
  const w = App.wiz; if (!w) return;
  const list = steps(w.d).filter(s => w.d[s] !== undefined);
  const last = list[list.length - 1];
  if (!last) { cancel(); return; }
  delete w.d[last];
  nextStep();
}
function cancel() { App.wiz = null; renderSheet(); renderCourt(); }

/* A whistle stops the game clock, so it stops this one too — and winds it back
   to the reading when the floor was tapped, because the seconds spent filling
   in the decision tree never ran in the arena. Returns whether it had been
   running, so the toast can say so. */
function stopAtWhistle(at) {
  const c = App.game.clock, was = c.running;
  c.remaining = clamp(at, 0, periodLen(c.period));
  c.startRemaining = c.remaining;
  c.startedAt = Date.now();
  c.running = false;
  return was;
}
const clockNote = (stopped, at) =>
  stopped ? "  \u00b7  clock stopped at " + fmtClock(at).replace(/\.\d$/, "") : "";

/* Build the event a completed decision tree describes. Shared by the tracker
   and by the Log tab's editor, so a corrected event is built exactly the way
   the original was. */
function chanceEventFrom(d) {
  const three = d.cls === "three";
  if (d.res === "to") {
    /* The laptop's own turnover event, plus the court spot it ignores and the
       phone charts. gradeTO() does the rest: live 0, dead 1. */
    return {
      type: "to", team: d.team, pl: d.pl || null, pt: d.pt || "Unknown",
      live: d.live === "live", kind: d.live === "off" ? "Offensive foul" : null,
      cls: d.cls, zone: d.zone, x: d.x, y: d.y
    };
  }
  const base = {
    team: d.team, pl: d.pl || null, pt: d.pt || "Unknown",
    cls: d.cls, zone: d.zone, x: d.x, y: d.y, preset: false,
    st: three ? d.st : null, ct: d.ct
  };
  /* Who of ours was guarding. The laptop ignores the field; the phone reports
     on it. Only meaningful on their offence. */
  if (d.team === "them" && d.dfn) base.dfn = d.dfn;
  if (d.res === "foul") {
    /* A shooting foul that drew no basket. Logged as the laptop's FT trip
       (so PQ grades Gold and the team-foul count is right) plus the shot
       context, which the laptop ignores and the phone charts. */
    const n = three ? 3 : 2;
    const made = d.ft == null ? null : d.ft;
    const ev = Object.assign({ type: "ft", seq: made == null ? "" : "M".repeat(made) + "X".repeat(n - made) }, base);
    if (made == null) ev.ftUnknown = true;
    return ev;
  }
  const ev = Object.assign({ type: "shot", made: d.res === "make" || d.res === "and1", and1: d.res === "and1", blocked: false }, base);
  if (d.res === "and1") { if (d.ft == null) { ev.ftMade = false; ev.ftUnknown = true; } else ev.ftMade = !!d.ft; }
  return ev;
}

/* Read an event back into the shape the decision tree uses, so the editor can
   re-ask any single question. */
function dFromEvent(ev) {
  const d = {
    team: ev.team, pl: ev.pl, pt: ev.pt, cls: ev.cls, zone: ev.zone,
    x: ev.x, y: ev.y, st: ev.st || null, ct: ev.ct
  };
  if (ev.type === "to") {
    d.res = "to";
    d.live = ev.kind === "Offensive foul" ? "off" : ev.live ? "live" : "dead";
  } else if (ev.type === "ft") {
    d.res = "foul";
    d.ft = ev.ftUnknown ? null : (String(ev.seq || "").match(/M/g) || []).length;
  } else {
    d.res = ev.and1 ? "and1" : ev.made ? "make" : "miss";
    if (ev.and1) d.ft = ev.ftUnknown ? null : (ev.ftMade ? 1 : 0);
  }
  if (ev.dfn) d.dfn = ev.dfn;
  return d;
}

function finish() {
  const d = App.wiz.d;
  const at = d.cAt != null ? d.cAt : tapClock();
  const alreadyStopped = !!App.wiz.stopped;   // the whistle stopped it earlier
  const ev = chanceEventFrom(d);
  if (d.res === "to") {
    App.wiz = null;
    const stopped = alreadyStopped || (!ev.live && stopAtWhistle(at));
    commitEv(ev, at);
    renderAll();
    const c = chances(App.game).slice(-1)[0];
    toast(describeEvent(ev) + "  \u00b7  " + tierOf(c.grade).name + " " + c.grade + clockNote(stopped, at));
    return;
  }
  App.wiz = null;
  /* A shooting foul or an and-1 means free throws, so the ball is dead. */
  const stopped = alreadyStopped || ((d.res === "foul" || d.res === "and1") && stopAtWhistle(at));
  commitEv(ev, at);
  const a = attempts(App.game).slice(-1)[0];
  toast(describeShot(a) + "  \u00b7  " + tierOf(a.grade).name + " " + a.grade + clockNote(stopped, at));
  /* A live miss goes straight to the glass, so ask for the board. */
  if (needsRebound(ev)) startReb(ev.team);
  else renderAll();
}

/* ---------- rebounds ----------
   The last piece a possession count needs: until the board is cleared, one
   possession can span several chances. Written as the laptop's own reb event,
   which reads offensive or defensive from whose shot it followed. */
function needsRebound(ev) {
  if (ev.type === "shot") return !ev.made || (ev.and1 && !ev.ftMade);
  if (ev.type === "ft") return String(ev.seq || "").slice(-1) === "X";
  return false;
}
function startReb(team) { App.reb = { team: team }; renderSheet(); }
function doReb(team, pl, offensive) {

    (offensive ? "offensive" : "defensive") + " rebound");

function describeShot(a) {

/* ---------- step definitions ---------- */
const RES_OPTS = [
  { v: "make", lab: "Make", cls: "make" },
  { v: "miss", lab: "Miss", cls: "miss" },
  { v: "foul", lab: "Foul", sub: "no basket", cls: "gold" },
  { v: "and1", lab: "And-1", sub: "foul + make", cls: "gold" },
  { v: "to", lab: "Turnover", sub: "lost the ball here", cls: "turn", wide: true }
];
const CLS_OPTS = [{ v: "rim", lab: "At rim" }, { v: "paint", lab: "Paint" }, { v: "mid", lab: "Mid-range 2" }, { v: "three", lab: "3PT" }];
function nearestZone(cls, x, y) {
  const c = ZONES.filter(z => z.cls === cls);

}
function stepDef(s, d) {
  const S = App.S, g = App.game;
  switch (s) {
    case "cls": return { q: "Shot type", sub: "Overrides what the tapped spot suggests", opts: CLS_OPTS.map(o => ({ lab: o.lab, v: o.v })) };
    case "st": return {
      q: "3-point shot", sub: "How did it get off?", two: true,
      opts: [{ lab: "Catch & shoot", v: "cs", pq: gradeShot("three", "cs", "open") }, { lab: "Off the dribble", v: "otd", pq: gradeShot("three", "otd", "open") }]
    };
    case "pl": {
      const mine = d.team === "us";
      const on = onFloor();
      /* Only the five on the floor, so the grid stays a glance rather than a
         search. "Other" opens the full roster for a sub that went unlogged. */
      if (mine && on.length && !App._allPlayers) {
        const opts = on.map(id => { const p = playerById(id); return { jer: p ? p.num : "?", nm: p ? lastName(p.name) : "", v: id }; });
        return {
          q: "Who had the ball?", sub: "On the floor", nums: true,
          opts: opts.concat([{ lab: "Other", sub: "whole roster", v: "__other" }, { lab: "Unknown", v: null }])
        };
      }
      const opts = roster(g, d.team).map(p => ({ jer: p.num, nm: lastName(p.name), v: p.id }));
      return {
        q: "Who had the ball?",
        sub: mine ? (on.length ? "Whole roster" : "Set the lineup to shorten this list") : "Tap a number, or type theirs below",
        nums: true,
        opts: opts.concat([{ lab: mine ? "Unknown" : "No number", v: null }]), typeNum: !mine
      };
    }
    case "res": return { q: "Outcome", two: true, opts: RES_OPTS.map(o => ({ lab: o.lab, sub: o.sub, v: o.v, k: o.cls, wide: o.wide })) };
    case "ct": {
      const list = S.contest3 ? CONTESTS : [CONTESTS[0], CONTESTS[2]];
      return {
        q: "Contest", sub: "Sets the PQ grade", two: !S.contest3,
        opts: list.map(c => ({ lab: c.k === "open" ? "Uncontested" : c.k === "light" ? "Light contest" : "Contested", v: c.k, pq: gradeShot(d.cls, d.st, c.k) }))
      };
    }
    case "ft": {
      if (d.res === "and1") return { q: "And-1 free throw", two: true, opts: [{ lab: "Made", v: 1, k: "make" }, { lab: "Missed", v: 0, k: "miss" }], skip: "Not sure" };
      const n = d.cls === "three" ? 3 : 2;
      const opts = [];
      for (let m = n; m >= 0; m--) opts.push({ lab: m + " of " + n, sub: m === n ? "all made" : m === 0 ? "all missed" : null, v: m, k: m === n ? "make" : m === 0 ? "miss" : null });
      return { q: n + " free throws", sub: "How many went in?", opts, skip: "Not sure" };
    }
    case "dfn": {
      const on = onFloor();
      const opts = (on.length ? on : roster(App.game, "us").map(p => p.id)).map(id => {
        const p = playerById(id);
        return { jer: p ? p.num : "?", nm: p ? lastName(p.name) : "", v: id };
      });
      return {
        q: "Who was guarding?", sub: "Our five — this is what builds the scored-on table",
        nums: true, opts: opts, skip: "Not sure"
      };
    }
    case "live": return {
      q: "How did we lose it?", sub: "Sets the PQ grade",
      opts: [
        { lab: "Live ball", sub: "steal, strip, pass picked off", v: "live", pq: 0, k: "miss" },
        { lab: "Dead ball", sub: "travel, out of bounds, shot clock", v: "dead", pq: 1 },
        { lab: "Offensive foul", sub: "dead ball + a team foul", v: "off", pq: 1 }
      ]
    };
    case "pt": return { q: "Offensive trigger", sub: "What got the shot", grid: "trig",
      opts: S.playTypes.map(p => ({ lab: p, sub: PLAY_TYPE_FULL[p] || "", v: p })), skip: "Unknown" };
  }
  return { q: s, opts: [] };
}

    else { h += '<span class="lab">' + esc(o.lab) + "</span>"; if (o.sub) h += '<span class="sub">' + esc(o.sub) + "</span>"; }

  h += '<div class="sheet-foot"><button data-act="back">← Back</button>';

  h += '<button data-act="cancel">Cancel</button></div></div>';
  sheet.innerHTML = h;

  sheet.addEventListener("click", e => {
    const opt = e.target.closest(".opt");
    if (opt) {
      const v = def.opts[+opt.dataset.i].v;

  });

    /* overriding the class keeps the tapped spot but re-homes the zone */
    sheet.addEventListener("click", e => {

      const v = def.opts[+opt.dataset.i].v;

  });

/* Scoreboard-style entry: digits fill from the right and the colon writes
   itself, so 3-2-3 reads 0:03 → 0:32 → 3:23. The laptop's parseClock treats a
   bare number as seconds, which is why this is the phone's own parser. */
function clockDigits(raw) {
  const d = String(raw == null ? "" : raw).replace(/\D/g, "").slice(-4);
  if (!d) return "";
  return (d.slice(0, -2) || "0") + ":" + d.slice(-2).padStart(2, "0");
}
function parseTypedClock(raw) {
  const d = String(raw == null ? "" : raw).replace(/\D/g, "").slice(-4);
  if (!d) return null;
  const ss = Math.min(59, +(d.slice(-2) || 0));   // 3:70 is a typo, not 4:10
  return +(d.slice(0, -2) || 0) * 60 + ss;
}

function editClock() {
  const clk = $("#clkBtn"), ed = $("#clkEdit"), inp = $("#clkIn");

  inp.value = fmtClock(clockNow()).replace(/\.\d$/, "");
  inp.focus(); inp.select();
}
function endClockEdit(apply) {
  const clk = $("#clkBtn"), ed = $("#clkEdit"), inp = $("#clkIn");
  if (!inp || inp.hidden) return;
  if (apply) { const v = parseTypedClock(inp.value); if (v != null) setClockTo(v); }
  inp.hidden = true; clk.hidden = false;
  renderBar();
}

/* ---------- substitutions ----------
   Written as the laptop's own sub events, so its rotation timeline, stints
   and minutes are built from whatever the phone logged. An incoming player
   takes the outgoing player's slot, which keeps the strip order stable. */
function startSub(slot, pid) { App.sub = { slot: slot, out: pid || null }; renderSheet(); }
function doSub(inId) {
  const out = App.sub ? App.sub.out : null;
  App.sub = null;

  if (out && inId) commitEv({ type: "sub", team: "us", out: [out], in: [inId] });
  else if (inId) commitEv({ type: "sub", team: "us", out: [], in: [inId] });
  else if (out) commitEv({ type: "sub", team: "us", out: [out], in: [] });
  else { renderSheet(); return; }
  renderAll();
  toast(out && inId ? label(inId) + " in for " + label(out) : inId ? label(inId) + " on" : label(out) + " off");
}

/* How much of the board is actually logged. Possessions are only trustworthy
   when nearly every miss has a rebound against it, so PPP is withheld rather
   than quietly wrong when it doesn't. */
function rebCoverage(game) {
  const evs = game.events || [];
  const need = evs.filter(needsRebound).length;
  const got = evs.filter(e => e.type === "reb").length;
  return { need: need, got: got, ratio: need ? Math.min(1, got / need) : 1 };
}
const PPP_MIN_COVERAGE = 0.8;

/* ---------- filters ---------- */
function filtered(list) {
  const F = App.F;
  const shotOnly = !!(F.cls || F.ct);   // those two questions only apply to shots
  return list.filter(a => (!shotOnly || !a.isTO) &&
    (!F.p || a.p === +F.p) && (!F.pt || a.pt === F.pt) &&
    (!F.cls || typeKey(a) === F.cls) && (!F.ct || (F.ct === "open" ? a.ct === "open" : a.ct !== "open")) &&
    (!F.pl || a.pl === F.pl));
}
const typeKey = a => (a.cls === "three" ? "three-" + (a.st || "cs") : a.cls);
const TYPE_LABEL = { rim: "At rim", paint: "Paint (non-rim)", mid: "Mid-range 2", "three-cs": "C&S 3", "three-otd": "OTD 3" };
const TYPE_ORDER = ["rim", "paint", "mid", "three-cs", "three-otd"];

function filterBar() {
  const g = App.game, F = App.F;
  const periods = Array.from(new Set(attempts(g).map(a => a.p))).sort();
  const sel = (id, label, opts, val) => '<select id="' + id + '"><option value="">' + label + '</option>' +
    opts.map(o => '<option value="' + esc(o[0]) + '"' + (String(val) === String(o[0]) ? " selected" : "") + ">" + esc(o[1]) + "</option>").join("") + "</select>";
  return '<div class="filters">' +
    sel("fP", "All periods", periods.map(p => [p, periodName(p)]), F.p) +
    sel("fCls", "All shot types", TYPE_ORDER.map(k => [k, TYPE_LABEL[k]]), F.cls) +
    sel("fPt", "All triggers", App.S.playTypes.map(p => [p, p]), F.pt) +
    sel("fCt", "Open + contested", [["open", "Uncontested only"], ["cont", "Contested only"]], F.ct) +
    sel("fPl", "All players", roster(g, App.team).map(p => [p.id, ("#" + p.num + " " + (p.name || "")).trim()]), F.pl) +

/* ---------- report tab ---------- */
function groupRows(list, keyFn, order) {
  const m = new Map();
  list.forEach(a => { const k = keyFn(a); if (!m.has(k)) m.set(k, []); m.get(k).push(a); });
  let keys = Array.from(m.keys());
  if (order) keys = order.filter(k => m.has(k)).concat(keys.filter(k => order.indexOf(k) < 0));
  else keys.sort((a, b) => m.get(b).length - m.get(a).length);
  return keys.map(k => ({ k, t: tally(m.get(k)) }));
}
function table(head, rows, total, labelFn, maxN, extra, countLabel) {
  if (!rows.length) return '<div class="empty">Nothing logged yet.</div>';
  const showTO = rows.some(r => r.t.to > 0) || !!(total && total.to);
  const ex = extra ? (Array.isArray(extra) ? extra : [extra]) : [];
  const cl = countLabel || "Att";
  let h = '<div class="scroll"><table><thead><tr><th>' + head + "</th>" +
    ex.map(c => "<th>" + esc(c.head) + "</th>").join("") +
    "<th>" + cl + "</th>" + (showTO ? "<th>TO</th>" : "") +
    "<th>FG</th><th>FG%</th><th>PQ</th><th>Pts/" + (cl === "Chances" ? "ch" : "att") + "</th></tr></thead><tbody>";
  rows.forEach(r => {
    const t = r.t, share = maxN ? Math.round(100 * t.n / maxN) : 0;
    h += "<tr><td>" + esc(labelFn ? labelFn(r.k) : r.k) +
      (maxN ? '<div class="bar-mini"><i style="width:' + share + '%"></i></div>' : "") + "</td>" +
      ex.map(c => '<td class="tnum">' + esc(c.get(r.k)) + "</td>").join("") +
      '<td class="tnum">' + t.n + "</td>" + (showTO ? '<td class="tnum">' + (t.to || "") + "</td>" : "") +
      '<td class="tnum">' + t.fgm + "-" + t.fga + "</td>" +
      '<td class="tnum">' + pct(t.fgm, t.fga) + "</td>" +
      '<td class="tnum" style="color:var(--pq' + (t.pqAvg >= 3.5 ? 4 : t.pqAvg >= 2.5 ? 3 : 2) + ')">' + fmt2(t.pqAvg) + "</td>" +
      '<td class="tnum">' + fmt2(t.ppa) + "</td></tr>";
  });
  h += "</tbody>";

/* Possessions, now that rebounds are logged. The engine already replays them:
   an offensive board keeps the same possession open across another chance. The
   number is only shown when enough of the glass was logged to trust it. */
function possessionBlock() {
  const cov = rebCoverage(App.game);
  const poss = ((App.D && App.D.poss) || []).filter(p => p.team === App.team);
  const pts = poss.reduce((n, p) => n + (p.pts || 0), 0);
  const ok = cov.ratio >= PPP_MIN_COVERAGE && poss.length > 0;
  const covText = cov.need
    ? cov.got + " of " + cov.need + " misses have a rebound logged (" + Math.round(cov.ratio * 100) + "%)"
    : "no misses yet";
  return {
    label: ok ? fmt2(pts / poss.length) : "–",
    note: ok
      ? "<b>" + poss.length + " possessions</b> for " + pts + " points — " + covText +
        ", so the possession count holds. An offensive board keeps one possession alive across two chances."
      : "<b>PPP is withheld.</b> " + covText.charAt(0).toUpperCase() + covText.slice(1) +
        ". A possession count needs the board cleared after nearly every miss, so this stays blank rather than " +
        "reporting a number that merges possessions together. Everything else above is per chance and is exact."
  };
}

/* A five-man group, identified by who the engine had on the floor. */
function lineupKey(a) {
  const m = App.D && App.D.meta && App.D.meta[a.id];
  const l = (m && m.lineup) || [];
  return l.length === 5 ? l.slice().sort().join(",") : "";
}
function lineupLabel(k) {
  return k.split(",")
    .map(id => { const p = playerById(id); return p ? p.num : "?"; })
    .sort((a, b) => (parseInt(a, 10) || 0) - (parseInt(b, 10) || 0))
    .map(n => "#" + n).join("  ");
}

/* ---------- background sync ----------
   Logging never waits for the network. Every change marks the game dirty and
   a debounced timer pushes the WHOLE game to the server, which merges it.
   Whole snapshots rather than per-event deltas because the server merge is
   idempotent and deduplicates: a lost send costs nothing, the next one
   carries everything, and there is no partial state to get wrong.

   What is remembered between sessions is only a fingerprint per game, kept
   apart from the game itself so recording a successful sync does not itself
   count as a change. */
const SYNC_KEY = "pqt.sync";
const SYNC_DEBOUNCE = 8000;        // a flurry of taps becomes one send
const SYNC_HEARTBEAT = 60000;      // safety net while nothing is happening
const SYNC_MAX_BACKOFF = 300000;   // never hammer a server that is down

const syncAll = () => Store.read(SYNC_KEY, {});
const syncSave = s => Store.write(SYNC_KEY, s);
/* Cheap fingerprint: the log only ever grows or is edited in place, so the
   count plus the last id changes whenever anything worth sending has. */
const gameStamp = g => (g.events || []).length + ":" + (((g.events || []).slice(-1)[0] || {}).id || "-");
const syncBase = () => String((App.S && App.S.apiBase) || "").trim().replace(/\/+$/, "");

function syncEnabled() {
  /* An artifact viewer blocks outside connections, so there is nothing to
     offer there. */
  return !window.ARTIFACT_MODE && !!syncBase() && (!App.S || App.S.autoSync !== false);
}

function pushGame(game) {
  const headers = { "Content-Type": "application/json" };
  /* The server's shared access code, if it has one set. */
  const tok = String((App.S && App.S.apiToken) || "").trim();
  if (tok) headers["X-Tracker-Token"] = tok;
  return fetch(syncBase() + "/api/import/laptop", {
    method: "POST", headers: headers,
    body: JSON.stringify({ game: game, merge: true })
  }).then(r => (r.ok ? r.json() : r.text().then(t => { throw new Error(r.status + " " + String(t).slice(0, 120)); })));
}

function setSync(status, msg) {
  App.sync.status = status;
  App.sync.msg = msg;
  renderSyncDot();
}

function scheduleSync(ms) {
  clearTimeout(App.sync.timer);
  App.sync.timer = setTimeout(() => flushSync(), ms);
}

/* Called on every save. Cheap: it only sets a timer. */
function markDirty() {
  if (!syncEnabled()) { setSync(syncBase() ? "paused" : "off", ""); return; }
  setSync("pending", "Not sent yet");
  scheduleSync(SYNC_DEBOUNCE);
}

function flushSync(force) {
  if (!syncEnabled() || App.sync.busy || !App.game) return Promise.resolve(false);
  const g = App.game, stamp = gameStamp(g), st = syncAll(), rec = st[g.id] || {};
  if (!force && rec.stamp === stamp) { setSync("ok", "Up to date"); return Promise.resolve(true); }
  if (typeof navigator !== "undefined" && navigator.onLine === false) {
    setSync("offline", "Offline — it will go when the signal is back");
    scheduleSync(SYNC_HEARTBEAT);
    return Promise.resolve(false);
  }
  App.sync.busy = true;
  setSync("busy", "Sending…");
  return pushGame(g).then(res => {
    st[g.id] = { stamp: stamp, at: Date.now(), fails: 0, key: res.key || gameKey(g) };
    syncSave(st);
    App.sync.busy = false;
    App.sync.fails = 0;
    setSync("ok", res.merged_with
      ? "Merged with another tracker's log"
      : "Sent " + res.shots_imported + " shots");
    scheduleSync(SYNC_HEARTBEAT);
    return true;
  }).catch(e => {
    App.sync.busy = false;
    App.sync.fails = (App.sync.fails || 0) + 1;
    st[g.id] = Object.assign({}, rec, { fails: App.sync.fails, lastError: String(e.message || e) });
    syncSave(st);
    setSync("error", "Not sent (" + String(e.message || e).slice(0, 48) + ") — retrying");
    /* Back off so a server that is down is not hammered from the bench. */
    scheduleSync(Math.min(SYNC_MAX_BACKOFF, 10000 * Math.pow(2, App.sync.fails - 1)));
    return false;
  });
}

/* Games finished earlier that never reached the server. */
function unsyncedGames() {
  const st = syncAll();
  return Store.index().filter(x => {
    if (App.game && x.id === App.game.id) return false;
    const g = Store.loadGame(x.id);
    return g && (st[x.id] || {}).stamp !== gameStamp(g);
  });
}

function sendAllGames() {
  const pending = unsyncedGames();
  if (!pending.length) { toast("Every game is already on the server"); return; }
  let done = 0;
  const next = i => {
    if (i >= pending.length) { toast("Sent " + done + " of " + pending.length + " games"); renderSetup(); return; }
    const g = Store.loadGame(pending[i].id);
    pushGame(g).then(() => {
      const st = syncAll();
      st[g.id] = { stamp: gameStamp(g), at: Date.now(), fails: 0 };
      syncSave(st);
      done++;
    }).catch(() => {}).then(() => next(i + 1));
  };
  toast("Sending " + pending.length + " game" + (pending.length === 1 ? "" : "s") + "…");
  next(0);
}

const SYNC_LABEL = {
  ok: "Synced", pending: "Queued", busy: "Sending", offline: "Offline",
  error: "Retrying", paused: "Sync off", off: ""
};
function renderSyncDot() {
  const el = $("#syncDot"); if (!el) return;
  const s = App.sync.status;
  el.hidden = s === "off";
  el.className = "syncdot " + s;
  el.title = App.sync.msg || SYNC_LABEL[s] || "";
  el.setAttribute("aria-label", "Sync: " + (SYNC_LABEL[s] || s));
}

/* ============================================================
   MacEwan Database Bridge
   Pushes 5-man lineup +/- stints, offensive tactical triggers,
   and defensive accountability data into the central MacEwan Database.
   ============================================================ */
function cleanPlayerName(g, id) {
  if (!id) return "Team";
  const p = roster(g, "us").concat(roster(g, "them")).find(x => x.id === id);
  if (!p) return "Team";
  return (p.name || "").trim() || ("Player #" + p.num);
}

function shortPlayerName(g, id) {
  if (!id) return "—";
  const p = roster(g, "us").concat(roster(g, "them")).find(x => x.id === id);
  if (!p) return "—";
  if (p.name) return p.name.split(" ")[0];
  return "#" + p.num;
}

function playerNum(g, id) {
  if (!id) return "";
  const p = roster(g, "us").concat(roster(g, "them")).find(x => x.id === id);
  return p ? p.num : "";
}

/* ============================================================
   Shot Tracker → MacEwan Database, in the same format as the old
   Offense / Defense Loggers so every Database view works on this data.
   ============================================================ */

/* Shot zones in the Database's codes (the loggers' codes): R rim, P paint,
   J mid-range jumper, C catch-and-shoot 3, D off-the-dribble 3. */
function mapShotZone(cls, st) {
  if (cls === "rim") return "R";
  if (cls === "paint") return "P";
  if (cls === "three") return st === "otd" ? "D" : "C";
  return "J";
}

/* Shot Tracker play types → the trigger names the Database filters on
   (PnR, Cut, Tran, ...). Types the loggers never had keep their own name.
   The original Shot Tracker play type is kept in `playType`. */
const DB_TRIGGER = {
  "PNR BH": "PnR", "PNR SC": "PnR", "OFB": "OBS", "ORB": "OR",
  "CUT": "Cut", "TRANS": "Tran", "ISO": "Iso", "DRIVE": "Drive", "INB": "INB"
};
function dbTrigger(pt) {
  if (!pt || pt === "Unknown") return "General";
  return DB_TRIGGER[pt] || pt;
}

function dbClock(c) {
  return c != null ? fmtClock(c).replace(/\.\d$/, "") : "00:00";
}

/* Our possession result, in the Offense Logger's outcome names. */
function offenseOutcome(c) {
  const contested = c.ct !== "open";
  if (c.kind === "to") return "turnover";
  if (c.kind === "ft") return c.pts > 0 ? "foul_made_ft" : "foul_no_ft";
  if (c.and1) return "and_1";
  if (c.made) return contested ? "contested_make" : "open_make";
  return contested ? "contested_miss" : "open_miss";
}

/* Their possession result, in the Defense Logger's outcome names. */
function defenseOutcome(c) {
  const contested = c.ct !== "open";
  if (c.kind === "to") return "forced_to";
  if (c.kind === "ft") return c.pts > 0 ? "foul_committed_fts" : "foul_committed";
  if (c.made) return contested ? "opp_contested_make" : "opp_open_make";
  return contested ? "stop_contested_miss" : "stop_open_miss";
}

/* Each phone is one "tracker" with a permanent id, a name and a role.
   Its report is saved under its own key, so two people tracking the same game
   never overwrite each other. The MacEwan Database combines the reports. */
function trackerInfo() {
  let id = localStorage.getItem('pqt.trackerId');
  if (!id) { id = 't' + uid(); localStorage.setItem('pqt.trackerId', id); }
  return {
    id: id,
    name: localStorage.getItem('pqt.trackerName') || ('Tracker ' + id.slice(-4).toUpperCase()),
    role: localStorage.getItem('pqt.trackerRole') || 'both'
  };
}

/* Sending reports to the cloud. Each report stays "pending" until the
   server confirms it was saved. Pending reports are re-sent when the page
   opens, when the phone gets signal back and when the tracker comes back on
   screen, so a dead gym connection never loses a game. The status line only
   says "sent" once the server has actually confirmed it. */
let _dbNetlifySyncTimer = null;
let _dbSyncInFlight = false;
const ST_PENDING_KEY = 'macewan_st_pending';

function stPendingKeys() {
  try { return JSON.parse(localStorage.getItem(ST_PENDING_KEY) || '[]') || []; } catch (e) { return []; }
}
function stSetPending(keys) {
  try { localStorage.setItem(ST_PENDING_KEY, JSON.stringify(Array.from(new Set(keys)))); } catch (e) {}
}
function stLocalReports() {
  try { return JSON.parse(localStorage.getItem('macewan_st_reports') || '{}') || {}; } catch (e) { return {}; }
}

function setDbSyncStatus(ok, text) {
  App._dbSyncOk = ok;
  App._dbSyncMsg = text;
  const el = typeof document !== 'undefined' && document.getElementById('dbSyncStatus');
  if (el) { el.textContent = text; el.style.color = ok ? '#2e7d32' : '#b26a00'; }
}

function flushDbReports() {
  if (typeof fetch === 'undefined' || _dbSyncInFlight) return;
  const keys = stPendingKeys();
  if (!keys.length) return;
  const local = stLocalReports();
  _dbSyncInFlight = true;
  Promise.all(keys.map(key => {
    const report = local[key];
    if (!report) return Promise.resolve({ key: key, ok: true, updated: null });
    return fetch('/.netlify/functions/save-content', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: key, content: JSON.stringify(report) })
    }).then(r => ({ key: key, ok: r.ok, updated: report.updated }))
      .catch(() => ({ key: key, ok: false, updated: report.updated }));
  })).then(results => {
    _dbSyncInFlight = false;
    const now = stLocalReports();
    // Done = saved, and not changed again on this phone while it was sending.
    const done = results.filter(r => r.ok && (!now[r.key] || now[r.key].updated === r.updated)).map(r => r.key);
    const failed = results.some(r => !r.ok);
    const left = stPendingKeys().filter(k => !done.includes(k));
    stSetPending(left);
    if (failed) {
      setDbSyncStatus(false, "⚠️ Not sent to the MacEwan Database yet (no connection?). It's saved on this phone and will send automatically once you're back online.");
      _dbNetlifySyncTimer = setTimeout(flushDbReports, 30000);
    } else if (left.length) {
      _dbNetlifySyncTimer = setTimeout(flushDbReports, 1500);
    } else {
      setDbSyncStatus(true, trackerInfo().name + " · sent to the MacEwan Database at " +
        new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
    }
  });
}

function syncReportDebounced(key) {
  stSetPending(stPendingKeys().concat([key]));
  clearTimeout(_dbNetlifySyncTimer);
  _dbNetlifySyncTimer = setTimeout(flushDbReports, 1200);
}

if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('online', () => setTimeout(flushDbReports, 500));
  window.addEventListener('load', () => setTimeout(flushDbReports, 2000));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(flushDbReports, 500); });
}

function bridgeToMacEwanDatabase(game, D, showNotice) {
  if (!game) return;
  try {
    const oppName = (game.opp && game.opp.name) || "Opponent";
    const dateStr = game.date || localDate();
    const gameId = "game_st_" + dateStr.replace(/[^0-9]/g, "") + "_" + oppName.toLowerCase().replace(/[^a-z0-9]/g, "");

    // 1. Build standardized 5-man stints
    const mappedStints = [];
    if (D && D.stints && D.stints.length > 0) {
      D.stints.forEach((st, idx) => {
        if (!st.ids || st.ids.length < 5) return;
        // The last stint also counts a basket scored right at its end.
        const last = idx === D.stints.length - 1;
        const inStint = s => s.gs >= st.s && (s.gs < st.e || (last && s.gs <= st.e));
        const ptsUs = sum((D.scoring || []).filter(s => s.team === "us" && inStint(s)).map(s => s.pts));
        const ptsThem = sum((D.scoring || []).filter(s => s.team === "them" && inStint(s)).map(s => s.pts));
        mappedStints.push({
          players: st.ids.map(id => cleanPlayerName(game, id)),
          shortNames: st.ids.map(id => shortPlayerName(game, id)),
          ptsFor: ptsUs,
          ptsAgainst: ptsThem
        });
      });
    }

    // Fallback: If no substitution stints have been closed yet, but a 5-man lineup is on court
    if (mappedStints.length === 0 && D && D.lineup && D.lineup.length >= 5) {
      mappedStints.push({
        players: D.lineup.map(id => cleanPlayerName(game, id)),
        shortNames: D.lineup.map(id => shortPlayerName(game, id)),
        ptsFor: D.score ? D.score.us : 0,
        ptsAgainst: D.score ? D.score.them : 0
      });
    }

    const T = trackerInfo();

    // 2. Our offence (our chances), in the Offense Logger's format
    const mappedOffEvents = [];
    const chancesList = (D && D.chances) || [];
    chancesList.filter(c => c.team === "us").forEach(c => {
      const sz = mapShotZone(c.cls, c.st);
      const pNum = playerNum(game, c.pl);
      const activeLineup = (c.lineup && c.lineup.length >= 5 ? c.lineup : (D.lineup || [])).map(id => cleanPlayerName(game, id));
      mappedOffEvents.push({
        id: "off_st_" + T.id + "_" + c.id,
        gameId: gameId,
        opponent: oppName,
        date: dateStr,
        quarter: periodName(c.p),
        gameClock: dbClock(c.clk),
        activeLineup: activeLineup,
        playerId: pNum ? ("p" + pNum) : "team",
        playerName: c.pl ? cleanPlayerName(game, c.pl) : "Team",
        playTrigger: dbTrigger(c.pt),
        playType: c.pt || "Unknown",
        shotZone: sz,
        isContested: c.kind === "shot" && c.ct !== "open",
        outcome: offenseOutcome(c),
        points: c.pts || 0,
        notationSymbol: "(" + sz + ")"
      });
    });

    // 3. Our defence (their chances), in the Defense Logger's format.
    //    The defender is the MacEwan player marked as guarding the shot
    //    (or who stole the ball); otherwise it's a team possession.
    const mappedDefEvents = [];
    chancesList.filter(c => c.team === "them").forEach(c => {
      const sz = mapShotZone(c.cls, c.st);
      const defNum = playerNum(game, c.dfn);
      const activeLineup = (c.lineup && c.lineup.length >= 5 ? c.lineup : (D.lineup || [])).map(id => cleanPlayerName(game, id));
      mappedDefEvents.push({
        id: "def_st_" + T.id + "_" + c.id,
        gameId: gameId,
        opponent: oppName,
        date: dateStr,
        quarter: periodName(c.p),
        gameClock: dbClock(c.clk),
        activeLineup: activeLineup,
        defenderId: defNum ? ("p" + defNum) : "team",
        defenderName: c.dfn ? cleanPlayerName(game, c.dfn) : "Team Defense",
        opponentTrigger: dbTrigger(c.pt),
        playType: c.pt || "Unknown",
        shotZone: sz,
        isContested: c.kind === "shot" && c.ct !== "open",
        outcome: defenseOutcome(c),
        pointsAllowed: c.pts || 0,
        notationSymbol: "<u>" + sz + "</u>"
      });
    });

    // 4. This tracker's own report. Saved under its own key: never overwrites anyone else.
    const reportKey = "st_report_" + gameId + "__" + T.id;
    const report = {
      gameId: gameId, opponent: oppName, date: dateStr,
      trackerId: T.id, trackerName: T.name, role: T.role,
      updated: Date.now(),
      isFinal: Boolean(game.clock && !game.clock.running && game.clock.period >= 4),
      stints: mappedStints, off: mappedOffEvents, def: mappedDefEvents
    };
    let localReports = {};
    try { localReports = JSON.parse(localStorage.getItem('macewan_st_reports') || '{}') || {}; } catch(e) { localReports = {}; }
    localReports[reportKey] = report;
    localStorage.setItem('macewan_st_reports', JSON.stringify(localReports));
    syncReportDebounced(reportKey);

    if (showNotice) {
      toast("Saved. Sending to the MacEwan Database (" + mappedStints.length + " lineups, " + (mappedOffEvents.length + mappedDefEvents.length) + " plays)…");
      renderSetup();
    }
  } catch(err) {
    console.warn("MacEwan Database bridge error:", err);
    if (showNotice) toast("Bridge notice: " + (err && err.message ? err.message : err));
  }
}

/* ---------- send to the Python server ---------- */
/* Logging is offline-first: shots are saved to this device as they happen and
   sent only when the coach asks, so a dead signal in an arena never costs a
   shot. The server re-derives every number from the events it receives. */
function sendToServer(btn) {
  if (!syncBase()) { toast("Add the server address first"); return; }
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = "Sending…";
  flushSync(true).then(ok => {
    btn.disabled = false; btn.textContent = label;
    toast(ok ? App.sync.msg : (App.sync.msg || "Could not send"));
    renderSetup();
  });
}

/* ---------- tabs ---------- */
function renderTab() {
  ["track", "log", "chart", "report", "analysis", "setup"].forEach(t => { $("#pane-" + t).hidden = t !== App.tab; });
  $$("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === App.tab));
  if (App.tab === "track") renderCourt();
  else if (App.tab === "log") renderLog();
  else if (App.tab === "chart") renderChart();
  else if (App.tab === "report") renderReport();
  else if (App.tab === "analysis") renderAnalysis();
  else renderSetup();
}

/* ---------- fouls and timeouts ----------
   Neither happens at a spot on the floor, so they are buttons rather than a
   court tap. Both are the laptop's own events, so its team-foul count, bonus
   and timeout tracking are built from whatever the phone logs. Both are
   whistles, so both stop the clock. */
function startQuick(kind) { App.quick = { kind: kind }; renderSheet(); }

function doQuick(ev) {
  App.quick = null;
  if (!ev) { renderAll(); return; }
  const stopped = stopAtWhistle(tapClock());
  commitEv(ev);
  renderAll();
  toast(describeEvent(ev) + clockNote(stopped, App.game.clock.remaining));
}

function renderQuickSheet() {
  const g = App.game, kind = App.quick.kind, on = onFloor();
  const scrim = document.createElement("div"); scrim.id = "scrim"; scrim.className = "scrim";
  scrim.addEventListener("click", () => { App.quick = null; renderAll(); });
  const sheet = document.createElement("div"); sheet.id = "sheet"; sheet.className = "sheet";
  sheet.setAttribute("role", "dialog");

  let opts = [];
  let h = '<div class="sheet-in"><div class="grab"></div><div class="crumbs">' +
    '<span class="crumb">' + esc(periodName(g.clock.period)) + " " +
    esc(fmtClock(clockNow()).replace(/\.\d$/, "")) + "</span></div>";

  if (kind === "foul") {
    opts = (on.length ? on : roster(g, "us").map(p => p.id)).map(id => {
      const p = playerById(id);
      return { jer: p ? p.num : "?", nm: p ? lastName(p.name) : "", ev: { type: "foul", team: "us", pl: id } };
    });
    opts.push({ lab: App.S.teamShort, sub: "team foul", ev: { type: "foul", team: "us", pl: null } });
    opts.push({ lab: g.opp.short, sub: "on them", wide: true, ev: { type: "foul", team: "them", pl: null } });
    h += '<div class="q">Who fouled?</div><div class="qsub">Shooting fouls are already counted with the shot — this is for the rest.</div>';
    h += '<div class="opts nums">';
  } else {
    opts = [
      { lab: App.S.teamName, sub: "our timeout", ev: { type: "timeout", team: "us" } },
      { lab: g.opp.name, sub: "their timeout", ev: { type: "timeout", team: "them" } }
    ];
    h += '<div class="q">Timeout</div><div class="qsub">Which bench?</div><div class="opts two">';
  }
  opts.forEach((o, i) => {
    h += '<button class="opt' + (o.wide ? " wide" : "") + '" data-i="' + i + '">';
    h += o.jer !== undefined
      ? '<span class="jer tnum">' + esc(o.jer) + "</span>" + (o.nm ? '<span class="nm">' + esc(o.nm) + "</span>" : "")
      : '<span class="lab">' + esc(o.lab) + "</span>" + (o.sub ? '<span class="sub">' + esc(o.sub) + "</span>" : "");
    h += "</button>";
  });
  h += '</div><div class="sheet-foot"><button data-act="cancel">Cancel</button></div></div>';
  sheet.innerHTML = h;
  sheet.addEventListener("click", e => {
    const opt = e.target.closest("[data-i]");
    if (opt) { doQuick(opts[+opt.dataset.i].ev); return; }
    if (e.target.closest('[data-act="cancel"]')) { App.quick = null; renderAll(); }
  });
  document.body.appendChild(scrim); document.body.appendChild(sheet);
}

/* Team fouls this quarter and timeouts used — both come straight out of the
   engine, so they match the laptop exactly. */
function renderStatLine() {
  const el = $("#statLine"); if (!el) return;
  const g = App.game, D = App.D, p = g.clock.period;
  if (!D || !D.teamFouls) { el.innerHTML = ""; return; }

  el.innerHTML = periodName(p) + " fouls: " + cell("us", App.S.teamShort) + " · " + cell("them", g.opp.short) +
    "  ·  Timeouts: " + esc(App.S.teamShort) + " <b>" + to("us") + "</b> · " +
    esc(g.opp.short) + " <b>" + to("them") + "</b>";

/* ---------- log tab ----------
   Every event, newest first, each one tappable to correct. The log is the
   game: fixing a row here rewrites the event, and score, PQ, lineups and
   possessions all fall out of it again. */
const RES_LABEL = { make: "Make", miss: "Miss", foul: "Foul", and1: "And-1", to: "Turnover" };
const LIVE_LABEL = { live: "Live ball", dead: "Dead ball", off: "Offensive foul" };

function renderLog() {
  const el = $("#pane-log"), g = App.game;
  const byId = {};
  chances(g).forEach(c => (byId[c.id] = c));
  const evs = (g.events || []);
  if (!evs.length) {
    el.innerHTML = '<div class="card"><div class="empty">Nothing logged yet. Everything you track shows up here, newest first, and any row can be corrected.</div></div>';
    return;
  }
  let h = '<div class="card"><h3>Game log</h3>' +
    '<div class="aistate">' + evs.length + " events, newest first. Tap any row to correct it.</div><div style=\"padding-top:4px\">";
  for (let i = evs.length - 1; i >= 0; i--) {
    const ev = evs[i], c = byId[ev.id];
    const sys = ev.type === "sub" || ev.type === "period_end" || ev.type === "reb";
    h += '<button class="lrow' + (ev.team === "them" ? " them" : "") + (sys ? " sys" : "") +
      '" data-ev="' + esc(ev.id) + '">' +
      '<span class="when">' + esc(periodName(ev.p) + " " + fmtClock(ev.c).replace(/\.\d$/, "")) + "</span>" +
      '<span class="what">' + esc(describeEvent(ev)) +
      (c ? "<i>" + esc(c.pt) + "</i>" : "") + "</span>" +
      (c ? '<span class="tierc"><span class="pqchip pq' + c.grade + '">' + tierOf(c.grade).name + " " + c.grade + "</span></span>" : "") +
      "</button>";
  }
  el.innerHTML = h + "</div></div>";
}

/* ---------- correcting an event ---------- */
function editFields(ev) {
  const g = App.game, d = dFromEvent(ev), f = [];
  if (ev.type === "reb") {
    return [{ k: "reb", label: "Rebound", value: (ev.pl ? pnameOf(g, ev.pl) : teamLbl(ev.team)) }];
  }
  if (ev.type === "foul") {
    return [{ k: "foulpl", label: "Fouled", value: ev.pl ? pnameOf(g, ev.pl) : teamLbl(ev.team) }];
  }
  if (ev.type === "sub" || ev.type === "period_end" || ev.type === "timeout") return f;
  f.push({ k: "pl", label: "Player", value: ev.pl ? pnameOf(g, ev.pl) : "Unknown" });
  f.push({ k: "res", label: "Outcome", value: RES_LABEL[d.res] });
  if (d.res === "to") {
    f.push({ k: "live", label: "How lost", value: LIVE_LABEL[d.live] });
  } else {
    f.push({ k: "cls", label: "Shot type", value: (zoneById(ev.zone) || {}).name || SHOT_CLASS[ev.cls] || "—" });
    if (ev.cls === "three") f.push({ k: "st", label: "3PT", value: ev.st === "otd" ? "Off the dribble" : "Catch & shoot" });
    f.push({ k: "ct", label: "Contest", value: (CONTESTS.find(c => c.k === ev.ct) || {}).name || "—" });
    if (ev.team === "them") {
      f.push({ k: "dfn", label: "Guarded by", value: ev.dfn ? pnameOf(g, ev.dfn) : "Not logged" });
    }
    if (d.res === "foul" || d.res === "and1") {
      f.push({ k: "ft", label: "Free throws",
        value: d.ft == null ? "Not logged" : (d.res === "and1" ? (d.ft ? "Made" : "Missed") : d.ft + " made") });
    }
  }
  f.push({ k: "pt", label: "Trigger", value: ev.pt || "Unknown" });
  return f;
}

function applyEdit(ev, key, value) {
  const i = App.game.events.findIndex(e => e.id === ev.id);
  if (i < 0) return;
  if (key === "reb" || key === "foulpl") {
    App.game.events[i] = Object.assign({}, ev, { team: value.team, pl: value.pl });
  } else {
    const d = dFromEvent(ev);
    d[key] = value;
    if (key === "cls") {
      d.zone = nearestZone(value, ev.x, ev.y);
      d.st = value === "three" ? (d.st || "cs") : null;
    }
    if (key === "res") {
      /* Switching between a shot and a giveaway needs the other branch's
         answers to exist; the coach can then correct them from the same list. */
      if (value === "to") { if (!d.live) d.live = "live"; }
      else { if (!d.ct) d.ct = "open"; if (d.cls === "three" && !d.st) d.st = "cs"; }
    }
    const next = chanceEventFrom(d);
    next.id = ev.id; next.p = ev.p; next.c = ev.c;
    if (ev.pqOverride != null) next.pqOverride = ev.pqOverride;
    App.game.events[i] = next;
  }
  save(); renderAll();
}

function deleteEvent(id) {
  const ev = App.game.events.find(e => e.id === id);
  if (!ev) return;
  App.game.events = App.game.events.filter(e => e.id !== id);
  App.edit = null;
  save(); renderAll();
  toast("Deleted " + describeEvent(ev));
}

function renderEditSheet() {
  const g = App.game, ev = g.events.find(e => e.id === App.edit.id);
  if (!ev) { App.edit = null; return; }
  const field = App.edit.field;

  const scrim = document.createElement("div"); scrim.id = "scrim"; scrim.className = "scrim";
  scrim.addEventListener("click", () => { App.edit = null; renderAll(); });
  const sheet = document.createElement("div"); sheet.id = "sheet"; sheet.className = "sheet";
  sheet.setAttribute("role", "dialog"); sheet.setAttribute("aria-label", "Correct this event");

  let h = '<div class="sheet-in"><div class="grab"></div><div class="crumbs">' +
    '<span class="crumb">' + esc(periodName(ev.p) + " " + fmtClock(ev.c).replace(/\.\d$/, "")) + "</span>" +
    '<span class="crumb">' + esc(teamLbl(ev.team)) + "</span></div>";

  if (field) {
    const def = field === "reb" ? rebEditDef(ev)
      : field === "foulpl" ? foulEditDef() : stepDef(field, dFromEvent(ev));
    h += '<div class="q">' + esc(def.q) + "</div>";
    if (def.sub) h += '<div class="qsub">' + esc(def.sub) + "</div>";
    h += '<div class="opts' + (def.two ? " two" : def.nums ? " nums" : def.grid ? " " + def.grid : "") + '">';
    def.opts.forEach((o, i) => {
      h += '<button class="opt' + (o.k ? " " + o.k : "") + (o.wide ? " wide" : "") + '" data-opt="' + i + '">';
      h += o.jer !== undefined
        ? '<span class="jer tnum">' + esc(o.jer) + "</span>" + (o.nm ? '<span class="nm">' + esc(o.nm) + "</span>" : "")
        : '<span class="lab">' + esc(o.lab) + "</span>" + (o.sub ? '<span class="sub">' + esc(o.sub) + "</span>" : "");
      if (o.pq != null) h += '<span class="pqchip pq' + o.pq + '">' + tierOf(o.pq).name + " " + o.pq + "</span>";
      h += "</button>";
    });
    h += '</div><div class="sheet-foot"><button data-act="back">← Back</button></div></div>';
    sheet.innerHTML = h;
    sheet.addEventListener("click", e => {
      const opt = e.target.closest("[data-opt]");
      if (opt) { applyEdit(ev, field, def.opts[+opt.dataset.opt].v); App.edit = { id: ev.id }; renderSheet(); return; }
      if (e.target.closest('[data-act="back"]')) { App.edit = { id: ev.id }; renderSheet(); }
    });
  } else {
    const fields = editFields(ev);
    h += '<div class="q">' + esc(describeEvent(ev)) + "</div>";
    h += '<div class="qsub">' + (fields.length ? "Tap a line to change it." : "This one can only be removed.") + "</div>";
    fields.forEach(f => {
      h += '<button class="erow" data-field="' + esc(f.k) + '"><span class="k">' + esc(f.label) + "</span>" +
        '<span class="v">' + esc(f.value) + '</span><span class="go">›</span></button>';
    });
    h += '<div class="sheet-foot" style="padding-top:10px">' +
      '<button class="skip" style="color:var(--out)" data-act="del">Delete this event</button>' +
      '<button data-act="close">Close</button></div></div>';
    sheet.innerHTML = h;
    sheet.addEventListener("click", e => {
      const f = e.target.closest("[data-field]");
      if (f) { App.edit = { id: ev.id, field: f.dataset.field }; renderSheet(); return; }
      const b = e.target.closest("[data-act]"); if (!b) return;
      if (b.dataset.act === "del") deleteEvent(ev.id);
      else { App.edit = null; renderAll(); }
    });
  }
  document.body.appendChild(scrim); document.body.appendChild(sheet);
}

/* Neither a foul nor a rebound has a step in the tree, so their options are
   built here. */
function foulEditDef() {
  const g = App.game, on = onFloor();
  const opts = (on.length ? on : roster(g, "us").map(p => p.id)).map(id => {
    const p = playerById(id);
    return { jer: p ? p.num : "?", nm: p ? lastName(p.name) : "", v: { team: "us", pl: id } };
  });
  opts.push({ lab: App.S.teamShort, sub: "team", v: { team: "us", pl: null } });
  opts.push({ lab: g.opp.short, sub: "on them", v: { team: "them", pl: null } });
  return { q: "Who fouled?", nums: true, opts: opts };
}

/* A rebound has no step in the tree, so its options are built here. */
function rebEditDef(ev) {
  const g = App.game, on = onFloor();
  const opts = (on.length ? on : roster(g, "us").map(p => p.id)).map(id => {
    const p = playerById(id);
    return { jer: p ? p.num : "?", nm: p ? lastName(p.name) : "", v: { team: "us", pl: id } };
  });
  opts.push({ lab: App.S.teamShort, sub: "team", v: { team: "us", pl: null } });
  opts.push({ lab: g.opp.short, sub: "their ball", v: { team: "them", pl: null } });
  return { q: "Who got the board?", nums: true, opts: opts };
}

/* ---------- analysis tab ---------- */
const READ_ICON = { bad: "!", watch: "!", good: "\u2713", info: "i" };

function renderAnalysis() {
  const el = $("#pane-analysis"), g = App.game, S = App.S;
  const reads = readsFor(g, App.D, S, App.team);

  let h = '<div class="card"><h3>' + esc(teamLbl(App.team)) + " \u00b7 live read</h3>" +
    '<div class="aistate">Rules over the shots you have logged. Updates with every shot, ' +
    'works with no signal, and every number is computed on this device.</div><div style="padding-top:6px">';
  reads.forEach(r => {
    h += '<div class="read ' + r.level + '"><span class="ic">' + (READ_ICON[r.level] || "i") + "</span>" +
      '<div class="body"><div class="tag">' + esc(r.tag) + "</div>" +
      '<div class="ttl">' + esc(r.title) + "</div>" +
      '<div class="num">' + esc(r.detail) + "</div>" +
      '<div class="act">' + esc(r.action) + "</div></div></div>";
  });
  h += "</div></div>";

  h += '<div class="card"><h3>Ask the analyst</h3>';
  if (window.ARTIFACT_MODE) {
    h += '<div class="aistate">A Claude artifact cannot reach the Anthropic API — the viewer blocks ' +
      'outside connections. The live read above works here; the written analysis works in the copy on ' +
      'your laptop and in the Python build, where the key sits on the server.</div>';
  } else if (!S.ai || !S.ai.apiKey) {
    h += '<div class="aistate">Add an Anthropic API key in <b>Setup \u2192 Claude analyst</b> and this ' +
      'turns on. It sends the already-computed table above — never the raw log — and asks for the ' +
      'judgement a rule cannot make.</div>' +
      '<div class="btnrow" style="padding-top:10px"><button class="btn ghost" data-act="gotokey">Open Setup</button></div>';
  } else {
    h += '<div class="presets" id="aiPresets">';
    COACH_PRESETS.forEach(p => { h += '<button data-ask="' + esc(p.k) + '">' + esc(p.label) + "</button>"; });
    h += "</div>";
    h += '<div class="askrow"><input id="aiQ" placeholder="Or ask your own question" ' +
      'value="' + esc(App._aiQ || "") + '"><button class="btn" data-act="ask">Ask</button></div>';
    h += '<div class="answer" id="aiAnswer">' + esc(App._answer || "") + "</div>";
    h += '<div class="aistate" style="padding-top:9px">Claude reads the computed table, not the shot log, ' +
      'and is told what this tracker does not record so it never reasons from a missing number.</div>';
  }
  h += "</div>";
  el.innerHTML = h;
}

function setAsking(on) {
  App._asking = on;
  $$("#aiPresets button").forEach(b => (b.disabled = on));
  const ask = $('#pane-analysis [data-act="ask"]');
  if (ask) { ask.disabled = on; ask.textContent = on ? "\u2026" : "Ask"; }
}

function runCoach(question) {
  if (App._asking) return;
  const out = $("#aiAnswer");
  App._answer = "";
  if (out) out.textContent = "";
  setAsking(true);
  askCoach({
    S: App.S, game: App.game, D: App.D, question,
    history: App.aiHistory || [],
    onText: t => { App._answer += t; if (out) out.textContent = App._answer; }
  }).then(full => {
    App.aiHistory = (App.aiHistory || []).concat([
      { role: "user", content: question }, { role: "assistant", content: full }
    ]).slice(-6);
  }).catch(e => {
    App._answer = "Couldn't get a read: " + (e && e.message ? e.message : e);
    if (out) out.textContent = App._answer;
  }).then(() => setAsking(false));
}
function renderAll() { recompute(); renderBar(); renderTab(); renderSheet(); }

/* ---------- wiring ---------- */
function wire() {
  $("#tabs").addEventListener("click", e => {
    const b = e.target.closest("button[data-tab]"); if (!b) return;
    App.tab = b.dataset.tab; renderTab();
  });
  $("#teamSeg").addEventListener("click", e => {
    const b = e.target.closest("button[data-team]"); if (!b) return;
    App.team = b.dataset.team; App.F.pl = ""; renderAll();
  });
  $("#perSeg").addEventListener("click", e => {
    if (e.target.closest("[data-end]")) { endPeriod(); return; }
    const b = e.target.closest("button[data-p]"); if (!b) return;
    App._confirmEnd = false;
    const p = +b.dataset.p;
    const c = App.game.clock;
    c.period = p; c.remaining = periodLen(p); c.startRemaining = c.remaining;
    c.startedAt = Date.now(); c.running = false;
    save(); renderAll();
  });
  $("#gameChip").addEventListener("click", () => { App.tab = "setup"; renderTab(); });
  $("#clkBtn").addEventListener("click", toggleClock);
  $("#clkEdit").addEventListener("click", editClock);
  $("#clkIn").addEventListener("input", e => {
    const el = e.target;
    el.value = clockDigits(el.value);              // the colon writes itself
    el.setSelectionRange(el.value.length, el.value.length);
  });
  $("#clkIn").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); endClockEdit(true); }
    else if (e.key === "Escape") { e.preventDefault(); endClockEdit(false); }
  });
  $("#clkIn").addEventListener("blur", () => endClockEdit(true));
  $("#lineupStrip").addEventListener("click", e => {
    const cell = e.target.closest("[data-slot]"); if (!cell) return;
    startSub(+cell.dataset.slot, cell.dataset.pid || null);
  });
  $("#courtHost").addEventListener("click", courtTap);
  $("#clockBar").addEventListener("click", e => {
    const b = e.target.closest("[data-adj]"); if (!b) return;
    setClockTo(clockNow() + (+b.dataset.adj));   // works running or stopped
  });
  $("#pane-track").addEventListener("click", e => {
    if (e.target.closest('[data-act="wipe"]')) clearDemo();
  });
  $("#undoBtn").addEventListener("click", undoLast);
  $("#quickActs").addEventListener("click", e => {
    const b = e.target.closest("[data-quick]"); if (!b) return;
    startQuick(b.dataset.quick);
  });

  /* chart + report filters */
  document.addEventListener("change", e => {
    const map = { fP: "p", fCls: "cls", fPt: "pt", fCt: "ct", fPl: "pl" };
    if (!map[e.target.id]) return;
    App.F[map[e.target.id]] = e.target.value;
    App.tab === "chart" ? renderChart() : renderReport();
  });

  $("#pane-log").addEventListener("click", e => {
    const row = e.target.closest("[data-ev]"); if (!row) return;
    App.edit = { id: row.dataset.ev };
    renderSheet();
  });
  $("#pane-analysis").addEventListener("click", e => {
    const ask = e.target.closest("[data-ask]");
    if (ask) {
      const p = COACH_PRESETS.find(x => x.k === ask.dataset.ask);
      if (p) runCoach(p.q);
      return;
    }
    const b = e.target.closest("[data-act]"); if (!b) return;
    if (b.dataset.act === "gotokey") { App.tab = "setup"; renderTab(); }
    else if (b.dataset.act === "ask") {
      const q = ($("#aiQ") && $("#aiQ").value || "").trim();
      if (q) runCoach(q);
    }
  });
  $("#pane-analysis").addEventListener("input", e => {
    if (e.target.id === "aiQ") App._aiQ = e.target.value;
  });
  $("#pane-analysis").addEventListener("keydown", e => {
    if (e.target.id === "aiQ" && e.key === "Enter") {
      const q = e.target.value.trim();
      if (q) runCoach(q);
    }
  });

  /* setup actions */
  $("#pane-setup").addEventListener("click", e => {
    const tg = e.target.closest("[data-tog]");
    if (tg) {
      const k = tg.dataset.tog;
      App.S[k] = App.S[k] === false ? true : !App.S[k];
      Store.saveSettings(App.S);
      if (k === "autoSync") { App.S.autoSync ? markDirty() : setSync("paused", ""); }
      renderSetup();
      return;
    }
    const del = e.target.closest("[data-del]");
    if (del) {
      App.game.us.roster = roster(App.game, "us").filter(p => p.id !== del.dataset.del);
      Store.saveRoster(App.game.us.roster); save(); renderSetup(); return;
    }
    const b = e.target.closest("[data-act]"); if (!b) return;
    const act = b.dataset.act;
    if (act === "loadroster") {
      if (!App._confirmRoster) { App._confirmRoster = true; renderSetup(); return; }
      App._confirmRoster = false;
      App.game.us.roster = griffinsRoster();
      Store.saveRoster(App.game.us.roster);
      save(); renderAll(); toast("Loaded the 2026-27 roster");
      return;
    }
    if (act === "addp") {
      App.game.us.roster = roster(App.game, "us").concat([{ id: uid(), num: "", name: "", pos: "" }]);
      save(); renderSetup();
    } else if (act === "csv") copyOut(toCSV(shotRows()), "CSV");
    else if (act === "json") copyOut(JSON.stringify(App.game, null, 2), "JSON");
    else if (act === "dlcsv") download("chances-" + App.game.date + ".csv", toCSV(shotRows()), "text/csv");
    else if (act === "sync") sendToServer(b);
    else if (act === "sendall") sendAllGames();
    else if (act === "dbsync") bridgeToMacEwanDatabase(App.game, App.D, true);
    else if (act === "newgame") {
      const r = Store.roster().length ? Store.roster() : roster(App.game, "us");
      App.game = newGame(r, { oppName: "Opponent", oppShort: "OPP" });
      save(); App.tab = "track"; renderAll(); toast("New game started");
    } else if (act === "wipe") clearDemo();
  });
  $("#pane-setup").addEventListener("change", e => {
    if (e.target.id === "sTrkName") { localStorage.setItem('pqt.trackerName', e.target.value.trim()); bridgeToMacEwanDatabase(App.game, App.D, false); renderSetup(); }
    else if (e.target.id === "sTrkRole") { localStorage.setItem('pqt.trackerRole', e.target.value); bridgeToMacEwanDatabase(App.game, App.D, true); }
  });
  $("#pane-setup").addEventListener("input", e => {
    const g = App.game, id = e.target.id;
    if (id === "sOpp") g.opp.name = e.target.value;
    else if (id === "sOppS") g.opp.short = e.target.value.toUpperCase();
    else if (id === "sDate") g.date = e.target.value;
    else if (id === "sRim") { const v = parseFloat(e.target.value); if (v > 0) { App.S.rimRadiusM = v; Store.saveSettings(App.S); } }
    else if (id === "sApi") { App.S.apiBase = e.target.value.trim(); Store.saveSettings(App.S); return; }
    else if (id === "sKey") { App.S.ai.apiKey = e.target.value.trim(); Store.saveSettings(App.S); return; }
    else if (id === "sTok") { App.S.apiToken = e.target.value.trim(); Store.saveSettings(App.S); return; }
    else if (id === "sPT") {
      const list = e.target.value.split(/\n/).map(s => s.trim()).filter(Boolean);
      App.S.playTypes = list.length ? list : DEFAULT_PLAY_TYPES.slice();
      Store.saveSettings(App.S);
    } else if (e.target.closest(".prow")) {
      const row = e.target.closest(".prow"), p = roster(g, "us").find(x => x.id === row.dataset.id);
      if (p) { p.num = row.querySelector(".n").value; p.name = row.querySelector(".nm").value; Store.saveRoster(g.us.roster); }
    } else return;
    if (id === "sOpp" || id === "sOppS") renderBar();
    save();
  });
  $("#pane-setup").addEventListener("change", e => {
    if (e.target.id === "sTeam") {
      const v = e.target.value, g = App.game;
      if (v === "__other") { App._oppOther = true; renderSetup(); return; }
      const t = cwTeamById(v);
      if (!t) return;
      App._oppOther = false;
      g.opp.name = t.name;
      g.opp.short = t.short;
      /* A different opponent means the old numbers are meaningless. */
      g.opp.roster = cwRoster(t);
      save(); renderAll();
      toast(t.name + (t.roster.length ? " · " + t.roster.length + " players loaded" : " · no roster on file"));
      return;
    }
    if (e.target.id === "sSticky") { App.S.stickyPT = e.target.value || null; Store.saveSettings(App.S); }
    else if (e.target.id === "sModel") { App.S.ai.model = e.target.value; Store.saveSettings(App.S); }
    else if (e.target.id === "sEffort") { App.S.ai.effort = e.target.value; Store.saveSettings(App.S); }
  });
}

boot();

</script>
