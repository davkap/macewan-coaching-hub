<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="/site-responsive.css">
<meta name="theme-color" content="#8D1838">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Griffins Shot Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: sticky brand bar + tab strip, a full-width half-court tap surface, and the
   decision tree rising as a bottom sheet of thumb-sized buttons. Griffins skin, matching
   the Practice Planner and the laptop PQ Game Tracker token-for-token. */
:root{
  --ground:#F5F2F0; --panel:#FFFFFF; --panel-2:#FBF8F7; --panel-3:#F1EAE7;
  --ink:#15100F; --ink-2:#574B47; --ink-3:#8C7D78;
  --rule:#E8E0DD; --rule-strong:#CFC1BC;
  --brand:#8D1838; --brand-2:#71122C;
  --accent:#8D1838; --accent-2:#B02745; --accent-soft:#FBEEF1; --accent-ink:#71122C;
  --gold:#D4A361; --gold-2:#C08F44; --gold-ink:#1A1410; --gold-line:#C29450;
  --on-brand:#FFFFFF; --on-brand-2:#E7C9CF;
  --go:#0C7A58; --go-soft:#E1F0EA; --out:#C22F26; --out-soft:#FBE7E5;
  --them:#3D6E9E; --them-soft:#E8EFF6;
  --pq4:#C99A2E; --pq3:#8D98A5; --pq2:#A5673A; --pq1:#5E5654; --pq0:#C22F26;
  --court:#FFFFFF; --court-paint:#FBF3F4; --court-line:#B29A8E;
  --shadow:0 1px 2px rgba(35,18,14,.05), 0 8px 22px -16px rgba(35,18,14,.24);
  --sheet-shadow:0 -8px 40px -12px rgba(35,18,14,.32);
  --sans:"Archivo", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --disp:"Barlow Condensed", "Archivo Narrow", "Archivo", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#100B0A; --panel:#191211; --panel-2:#211816; --panel-3:#2C201D;
  --ink:#F6EEEB; --ink-2:#BBA9A3; --ink-3:#8B7A74;
  --rule:#2C201D; --rule-strong:#463430;
  --brand:#8D1838; --brand-2:#A31E42;
  --accent:#E4718B; --accent-2:#F090A5; --accent-soft:#33131D; --accent-ink:#F5B6C3;
  --gold:#D4A361; --gold-2:#E6BC84; --gold-ink:#1A1410; --gold-line:#8A6A38;
  --on-brand:#FFFFFF; --on-brand-2:#E2BDC5;
  --go:#3FB98B; --go-soft:#0F2E24; --out:#E3706A; --out-soft:#331A1A;
  --them:#7FA9D6; --them-soft:#15222F;
  --pq4:#DDB04A; --pq3:#A9B3BE; --pq2:#C27F4C; --pq1:#8A817D; --pq0:#E5655D;
  --court:#1C1413; --court-paint:#241817; --court-line:#6E5A52;
  --shadow:0 1px 2px rgba(0,0,0,.55), 0 12px 28px -18px rgba(0,0,0,.9);
  --sheet-shadow:0 -8px 40px -10px rgba(0,0,0,.92);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#100B0A; --panel:#191211; --panel-2:#211816; --panel-3:#2C201D;
  --ink:#F6EEEB; --ink-2:#BBA9A3; --ink-3:#8B7A74;
  --rule:#2C201D; --rule-strong:#463430;
  --brand:#8D1838; --brand-2:#A31E42;
  --accent:#E4718B; --accent-2:#F090A5; --accent-soft:#33131D; --accent-ink:#F5B6C3;
  --gold:#D4A361; --gold-2:#E6BC84; --gold-ink:#1A1410; --gold-line:#8A6A38;
  --on-brand:#FFFFFF; --on-brand-2:#E2BDC5;
  --go:#3FB98B; --go-soft:#0F2E24; --out:#E3706A; --out-soft:#331A1A;
  --them:#7FA9D6; --them-soft:#15222F;
  --pq4:#DDB04A; --pq3:#A9B3BE; --pq2:#C27F4C; --pq1:#8A817D; --pq0:#E5655D;
  --court:#1C1413; --court-paint:#241817; --court-line:#6E5A52;
  --shadow:0 1px 2px rgba(0,0,0,.55), 0 12px 28px -18px rgba(0,0,0,.9);
  --sheet-shadow:0 -8px 40px -10px rgba(0,0,0,.92);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--disp);font-weight:600;letter-spacing:.01em;text-wrap:balance}
:focus-visible{outline:2.5px solid var(--accent-2);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}

#wrap{max-width:560px;margin:0 auto;padding:0 16px;padding-block:0 28px;min-height:100%;display:flex;flex-direction:column}

/* ---------- brand bar ---------- */
.stickyhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--ground)}
.bar{padding-block:10px 8px;display:flex;flex-direction:column;gap:8px}
.bar-top{display:flex;align-items:center;gap:10px;min-width:0}
.mark{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
  background:var(--brand);color:var(--on-brand);padding:4px 8px 3px;border-radius:3px;flex:none}
a.mark{text-decoration:none;display:inline-flex;align-items:center;min-height:32px;padding-inline:10px}
.gamechip{flex:1;min-width:0;text-align:left;font-family:var(--disp);font-size:17px;font-weight:600;
  color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gamechip .vs{color:var(--ink-3);font-weight:500}
/* A game's worth of work is on this phone until it reaches the server, so the
   state of that is worth one glance, not a menu. */
.syncdot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--ink-3)}
.syncdot.ok{background:var(--go)}
.syncdot.pending{background:var(--gold-2)}
.syncdot.busy{background:var(--accent);animation:pulse 1s ease-in-out infinite}
.syncdot.offline,.syncdot.error{background:var(--out)}
.syncdot.paused{background:var(--rule-strong)}
@media (prefers-reduced-motion:reduce){.syncdot.busy{animation:none}}
.score{flex:none;font-family:var(--disp);font-size:19px;font-weight:700;letter-spacing:.01em}
.score .sep{color:var(--ink-3);font-weight:500;padding:0 2px}

.seg{display:flex;background:var(--panel-3);border-radius:8px;padding:2px;gap:2px}
.seg button{flex:1;padding:8px 4px 7px;border-radius:6px;font-family:var(--disp);font-size:14px;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.seg.poss button.on[data-team="us"]{background:var(--brand);color:var(--on-brand)}
.seg.poss button.on[data-team="them"]{background:var(--them);color:#fff}
.bar-row{display:flex;gap:8px}
.bar-row.wrap{flex-wrap:wrap}
.bar-row.wrap .seg.per{flex:1 1 180px}
.clockbar{flex:1 1 auto;display:flex;gap:4px;align-items:stretch;background:var(--panel-3);border-radius:8px;padding:2px}
.cadj{flex:none;padding:7px 9px 6px;border-radius:6px;font-family:var(--disp);font-size:13.5px;font-weight:700;
  color:var(--ink-2);background:var(--panel);box-shadow:var(--shadow)}
.cadj:active{background:var(--accent-soft);color:var(--accent-ink)}
.bar-row .seg{flex:1;min-width:0}
.bar-row .seg.per{flex:1}
.seg.per button{padding-inline:6px}
.seg.per button.endp{background:var(--gold);color:var(--gold-ink);font-weight:700;letter-spacing:.05em}
.seg.per button.endp.armed{background:var(--out);color:#fff}
.clk{flex:1;min-width:66px;text-align:center;background:var(--panel-3);border:1.5px solid transparent;border-radius:8px;
  padding:7px 8px 6px;font-family:var(--disp);font-size:16px;font-weight:700;color:var(--ink-2);
  font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;gap:5px}
.clk::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.clk.run{background:var(--go-soft);border-color:var(--go);color:var(--go)}
.clk.run::before{background:var(--go);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.clk.run::before{animation:none}}
.clkedit{flex:none;padding:7px 8px 6px;border-radius:6px;background:transparent;color:var(--ink-3);font-size:12.5px}
.clkin{flex:none;width:72px;text-align:center;background:var(--panel);border:1.5px solid var(--accent);border-radius:8px;
  padding:7px 4px 6px;font-family:var(--disp);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- on-court strip ---------- */
.lineup{display:flex;gap:5px;align-items:stretch}
.lcell{flex:1;min-width:0;background:var(--panel);border:1.5px solid var(--rule);border-radius:8px;
  padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:0;overflow:hidden}
.lcell .jer{font-family:var(--disp);font-size:19px;font-weight:700;line-height:1.05}
.lcell .nm{font-size:9.5px;color:var(--ink-3);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcell.empty{border-style:dashed;color:var(--ink-3)}
.lcell.empty .jer{font-weight:500;color:var(--ink-3)}
.lcell:active{border-color:var(--accent);background:var(--accent-soft)}
.lhint{font-size:11px;color:var(--ink-3);text-align:center;padding-top:3px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1.5px solid var(--rule);background:var(--ground);
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;white-space:nowrap}
.tabs button{padding:10px 8px 8px;font-family:var(--disp);font-size:15px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-3);border-bottom:2.5px solid transparent;margin-bottom:-1.5px}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .tabs button.on{color:var(--accent);border-bottom-color:var(--accent)} }
:root[data-theme="dark"] .tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}

/* ---------- court ---------- */
.courtcard{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:8px;box-shadow:var(--shadow)}
.court{display:block;width:100%;height:auto;max-width:100%;border-radius:8px;touch-action:manipulation}
.c-floor{fill:var(--court)}
.c-paint{fill:var(--court-paint)}
.c-line{stroke:var(--court-line);stroke-width:2;fill:none}
.c-line text{stroke:none;fill:var(--ink-3);font-family:var(--disp);font-size:15px;letter-spacing:.08em}
.hint{text-align:center;font-size:12.5px;color:var(--ink-3);padding:7px 4px 2px}
.hint b{color:var(--ink-2);font-weight:600}

.mk{stroke-width:2.5;vector-effect:non-scaling-stroke}
.mk-make{fill:var(--go);stroke:none}
.mk-miss{fill:none;stroke:var(--out)}
.mk-foul{fill:var(--gold);stroke:var(--gold-2)}
.mk-and1{fill:var(--go);stroke:var(--gold);stroke-width:3.5}
.mk-tolive{fill:none;stroke:var(--out)}      /* empty triangle = live-ball TO */
.mk-todead{fill:var(--out);stroke:var(--out)} /* filled triangle = dead-ball TO */
.mk-them{opacity:.95}
.ghost{fill:var(--accent);opacity:.9}

/* ---------- quick actions ---------- */
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{flex:1;padding:12px 8px 11px;border-radius:9px;background:var(--panel);
  border:1.5px solid var(--rule-strong);font-family:var(--disp);font-size:15px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.acts button:active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.statline{font-size:11.5px;color:var(--ink-3);text-align:center;padding:8px 2px 0;line-height:1.5}
.statline b{color:var(--ink-2);font-weight:600}
.statline .bonus{color:var(--out);font-weight:700}

/* ---------- last-shot strip ---------- */
.strip{display:flex;align-items:center;gap:10px;margin-top:10px;background:var(--panel);border:1px solid var(--rule);
  border-radius:10px;padding:9px 10px;min-height:46px}
.strip-txt{flex:1;min-width:0;font-size:12.5px;color:var(--ink-2);line-height:1.35}
.strip-txt b{color:var(--ink);font-weight:600}
.strip-txt .em{color:var(--ink-3)}
.undo{flex:none;font-family:var(--disp);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--out);border:1.5px solid var(--out);border-radius:7px;padding:6px 10px 5px}
.undo[disabled]{color:var(--ink-3);border-color:var(--rule);cursor:default}

/* ---------- bottom sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(21,16,15,.5);z-index:40;animation:fade .14s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--panel);box-shadow:var(--sheet-shadow);
  border-radius:16px 16px 0 0;max-height:92vh;display:flex;flex-direction:column;
  padding:0 16px calc(14px + env(safe-area-inset-bottom,0px));animation:rise .18s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{animation:none}}
.sheet-in{max-width:528px;margin:0 auto;width:100%;display:flex;flex-direction:column;min-height:0}
.grab{width:38px;height:4px;border-radius:2px;background:var(--rule-strong);margin:8px auto 6px;flex:none}
.crumbs{display:flex;flex-wrap:wrap;gap:5px;padding-bottom:9px;flex:none}
.crumb{font-family:var(--disp);font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  background:var(--panel-3);color:var(--ink-2);border-radius:5px;padding:4px 7px 3px}
.crumb.tap{background:var(--accent-soft);color:var(--accent-ink)}
.q{font-family:var(--disp);font-size:23px;font-weight:600;padding-bottom:3px;flex:none}
.qsub{font-size:12.5px;color:var(--ink-3);padding-bottom:11px;flex:none}
.opts{display:grid;gap:8px;overflow-y:auto;padding-bottom:12px;min-height:0;
  grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.opts.two{grid-template-columns:1fr 1fr}
.opts.nums{grid-template-columns:repeat(auto-fit,minmax(74px,1fr))}
.opts.trig{grid-template-columns:repeat(3,1fr)}
.opts.trig .opt{min-height:58px;padding:9px 4px;gap:1px}
.opts.trig .lab{font-size:16px}
.opts.trig .sub{white-space:normal;line-height:1.2}
.opt{background:var(--panel-2);border:1.5px solid var(--rule);border-radius:10px;padding:13px 10px;min-height:62px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.opt:active{background:var(--accent-soft);border-color:var(--accent)}
.opt .lab{font-family:var(--disp);font-size:17px;font-weight:600;letter-spacing:.02em;line-height:1.1}
.opt .sub{font-size:11px;color:var(--ink-3);letter-spacing:.02em}
.opt .jer{font-family:var(--disp);font-size:27px;font-weight:700;line-height:1}
.opt .nm{font-size:11px;color:var(--ink-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt.make{background:var(--go-soft);border-color:var(--go)} .opt.make .lab{color:var(--go)}
.opt.miss{background:var(--out-soft);border-color:var(--out)} .opt.miss .lab{color:var(--out)}
.opt.gold{background:var(--panel-2);border-color:var(--gold-line)} .opt.gold .lab{color:var(--gold-2)}
.opt.turn{background:var(--panel-3);border-color:var(--rule-strong)} .opt.turn .lab{color:var(--ink-2)}
.opt.wide{grid-column:1/-1;min-height:54px}
.pqchip{font-family:var(--disp);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  border-radius:4px;padding:2px 5px 1px;color:var(--gold-ink)}
.pq4{background:var(--pq4)} .pq3{background:var(--pq3)} .pq2{background:var(--pq2)}
.pq1{background:var(--pq1);color:#fff} .pq0{background:var(--pq0);color:#fff}
.sheet-foot{display:flex;gap:8px;padding-top:3px;flex:none;border-top:1px solid var(--rule)}
.sheet-foot button{flex:1;padding:11px 8px 10px;font-family:var(--disp);font-size:14px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);border-radius:8px}
.sheet-foot button:active{background:var(--panel-3)}
.sheet-foot .skip{color:var(--accent-ink)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));
  z-index:60;background:var(--ink);color:var(--ground);border-radius:9px;padding:9px 14px;font-size:13px;
  box-shadow:var(--shadow);max-width:86vw;text-align:center}

/* ---------- panes / tables ---------- */
.pane{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:13px;box-shadow:var(--shadow)}
.card>h3{font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);padding-bottom:9px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:9px}
.tile{background:var(--panel-2);border:1px solid var(--rule);border-radius:9px;padding:9px 8px;text-align:center}
.tile .v{font-family:var(--disp);font-size:25px;font-weight:700;line-height:1.05}
.tile .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding-top:2px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:6px 5px;border-bottom:1px solid var(--rule);font-size:13px;white-space:nowrap}
th{font-family:var(--disp);font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
th:first-child,td:first-child{text-align:left;white-space:normal}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:1.5px solid var(--rule-strong);border-bottom:0}
.scroll{overflow-x:auto}
.bar-mini{height:5px;border-radius:3px;background:var(--panel-3);overflow:hidden;min-width:44px}
.bar-mini i{display:block;height:100%;background:var(--brand);border-radius:3px}
.empty{text-align:center;color:var(--ink-3);font-size:13px;padding:22px 10px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--ink-2);padding-top:9px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:50%;flex:none}
.filters{display:flex;flex-wrap:wrap;gap:7px;padding-bottom:10px}
.filters select{background:var(--panel-2);border:1.5px solid var(--rule);border-radius:7px;padding:7px 8px;font-size:12.5px;flex:1;min-width:104px}
label.fld{display:block;padding-bottom:9px}
label.fld span{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding-bottom:4px}
label.fld input,label.fld textarea,label.fld select{width:100%;background:var(--panel-2);border:1.5px solid var(--rule);
  border-radius:8px;padding:9px 10px;font-size:14px}
label.fld textarea{resize:vertical;font-size:13px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--brand);color:var(--on-brand);
  border-radius:8px;padding:11px 14px 10px;font-family:var(--disp);font-size:14px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase}
.btn.ghost{background:var(--panel-2);color:var(--ink);border:1.5px solid var(--rule-strong)}
.btn.danger{background:var(--out-soft);color:var(--out);border:1.5px solid var(--out)}
.btn.wide{width:100%}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btnrow .btn{flex:1;min-width:128px}
.note{font-size:12px;color:var(--ink-3);line-height:1.5;padding-top:8px}
.note b{color:var(--ink-2);font-weight:600}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule)}
.sw:last-child{border-bottom:0}
.sw-t{font-size:13px}
.sw-t i{display:block;font-size:11.5px;color:var(--ink-3);font-style:normal;padding-top:1px}
.tog{flex:none;width:46px;height:27px;border-radius:14px;background:var(--rule-strong);position:relative;transition:background .15s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;

<script>
/* ---- inlined from js/core.js ---- */
/* ============================================================
   core.js — helpers, PQ rules, court geometry, persistence
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
/* Today's date in the device's own time zone (YYYY-MM-DD). toISOString() is
   UTC, which turns an evening game in Edmonton into tomorrow's date. */
const localDate = (d = new Date()) =>
  d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const sum = a => a.reduce((s, x) => s + x, 0);
const fmt1 = n => (n == null || isNaN(n)) ? "–" : n.toFixed(1);
const fmt2 = n => (n == null || isNaN(n)) ? "–" : n.toFixed(2);
const signed = (n, d = 2) => (n == null || isNaN(n)) ? "–" : (n > 0 ? "+" : n < 0 ? "−" : "±") + Math.abs(n).toFixed(d);
const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "–";

/* seconds → "m:ss" (clock) ; tenths under a minute like a scoreboard */
function fmtClock(sec) {
  sec = Math.max(0, sec);
  if (sec < 60) return "0:" + String(Math.floor(sec)).padStart(2, "0") + "." + Math.floor((sec % 1) * 10);
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ":" + String(s).padStart(2, "0");
}
function fmtMin(sec) {           // minutes played "12:34"
  sec = Math.max(0, Math.round(sec));
  return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
}
function parseClock(str) {       // "4:32" | "4.32" | "272" → seconds
  str = String(str || "").trim();
  if (!str) return null;
  const m = str.match(/^(\d{1,2})[:.](\d{1,2}(?:\.\d)?)$/);
  if (m) return +m[1] * 60 + parseFloat(m[2]);
  if (/^\d+(\.\d)?$/.test(str)) return parseFloat(str);
  return null;
}

/* ---------- FIBA timing ---------- */
const periodLen = p => (p <= 4 ? 600 : 300);
const periodName = p => (p <= 4 ? "Q" + p : "OT" + (p - 4));
function gameSec(p, c) {         // elapsed game seconds at (period, clock remaining)
  let s = 0;
  for (let i = 1; i < p; i++) s += periodLen(i);
  return s + (periodLen(p) - c);
}

/* ---------- Possession Quality ---------- */
const TIERS = [
  { v: 0, key: "live", name: "Live TO", short: "LTO" },
  { v: 1, key: "dead", name: "Dead TO", short: "DTO" },
  { v: 2, key: "bronze", name: "Bronze", short: "BRZ" },
  { v: 3, key: "silver", name: "Silver", short: "SLV" },
  { v: 4, key: "gold", name: "Gold", short: "GLD" }
];
const tierOf = v => TIERS[v] || TIERS[0];
const CONTESTS = [
  { k: "open", name: "Wide open" },
  { k: "light", name: "Lightly contested" },
  { k: "heavy", name: "Heavily contested" }
];
const SHOT_CLASS = { rim: "At rim", paint: "Paint (non-rim)", mid: "Mid-range 2", three: "3PT" };

/* The grading matrix — the single source of truth for PQ.
   cls: rim | paint | mid | three ; st: cs | otd (threes only) ; ct: open | light | heavy */
function gradeShot(cls, st, ct) {
  if (cls === "rim") return ct === "heavy" ? 2 : 4;
  if (cls === "paint") return ct === "heavy" ? 2 : 3;
  if (cls === "mid") return ct === "open" ? 3 : 2;
  if (cls === "three") {
    if (st === "otd") return ct === "open" ? 3 : 2;
    return ct === "open" ? 4 : ct === "light" ? 3 : 2;       // catch & shoot
  }
  return 2;
}
const gradeTO = live => (live ? 0 : 1);
const GRADE_FT = 4;

/* ---------- Court geometry (FIBA, 1 m = 33.333 units, basket at top) ---------- */
const M = 100 / 3;
const COURT = {
  w: 500, h: 470, rimX: 250, rimY: 1.575 * M,
  three: 6.75 * M, cornerX: 0.9 * M,
  paintW: 4.9 * M, paintD: 5.8 * M, ftR: 1.8 * M, raR: 1.25 * M
};
COURT.cornerY = COURT.rimY + Math.sqrt(COURT.three ** 2 - (COURT.w / 2 - COURT.cornerX) ** 2);
COURT.paintX0 = COURT.w / 2 - COURT.paintW / 2;
COURT.paintX1 = COURT.w / 2 + COURT.paintW / 2;

/* Preset zones — key, label, class, representative point, three? */
const ZONES = [
  { id: "rim", key: "1", name: "Rim", cls: "rim", x: 250, y: 72 },
  { id: "paint", key: "2", name: "Paint", cls: "paint", x: 250, y: 150 },
  { id: "midLB", key: "3", name: "L Base 2", cls: "mid", x: 110, y: 70 },
  { id: "midLW", key: "4", name: "L Elbow 2", cls: "mid", x: 128, y: 196 },
  { id: "midT", key: "5", name: "Top 2", cls: "mid", x: 250, y: 258 },
  { id: "midRW", key: "6", name: "R Elbow 2", cls: "mid", x: 372, y: 196 },
  { id: "midRB", key: "7", name: "R Base 2", cls: "mid", x: 390, y: 70 },
  { id: "c3L", key: "8", name: "L Corner 3", cls: "three", x: 14, y: 46 },
  { id: "w3L", key: "9", name: "L Wing 3", cls: "three", x: 58, y: 262 },
  { id: "t3", key: "0", name: "Top 3", cls: "three", x: 250, y: 312 },
  { id: "w3R", key: "-", name: "R Wing 3", cls: "three", x: 442, y: 262 },
  { id: "c3R", key: "=", name: "R Corner 3", cls: "three", x: 486, y: 46 }
];
const zoneById = id => ZONES.find(z => z.id === id);

/* classify a clicked point → {cls, zone} */
function classifyPoint(x, y, rimRadiusM) {
  const dx = x - COURT.rimX, dy = y - COURT.rimY, d = Math.hypot(dx, dy);
  const left = x < 250;
  const corner = (x < COURT.cornerX || x > COURT.w - COURT.cornerX) && y <= COURT.cornerY;
  if (corner) return { cls: "three", zone: left ? "c3L" : "c3R" };
  if (d > COURT.three && y > COURT.cornerY) {
    if (Math.abs(dx) <= 85) return { cls: "three", zone: "t3" };
    return { cls: "three", zone: left ? "w3L" : "w3R" };
  }
  if (d <= (rimRadiusM || 1.5) * M) return { cls: "rim", zone: "rim" };
  if (x >= COURT.paintX0 && x <= COURT.paintX1 && y <= COURT.paintD) return { cls: "paint", zone: "paint" };
  if (y > COURT.paintD && Math.abs(dx) <= 85) return { cls: "mid", zone: "midT" };
  if (y < 125) return { cls: "mid", zone: left ? "midLB" : "midRB" };
  return { cls: "mid", zone: left ? "midLW" : "midRW" };
}

/* SVG for a half court (basket at top) */
function courtSVG(inner, extraClass) {
  const C = COURT, r = C.rimY;
  let s = '<svg class="court ' + (extraClass || "") + '" viewBox="0 0 ' + C.w + ' ' + C.h + '" xmlns="http://www.w3.org/2000/svg">';
  s += '<rect x="0" y="0" width="' + C.w + '" height="' + C.h + '" class="c-floor"/>';
  s += '<rect x="' + C.paintX0 + '" y="0" width="' + C.paintW + '" height="' + C.paintD + '" class="c-paint"/>';
  s += '<g class="c-line">';
  s += '<rect x="0" y="0" width="' + C.w + '" height="' + C.h + '" fill="none"/>';
  s += '<rect x="' + C.paintX0 + '" y="0" width="' + C.paintW + '" height="' + C.paintD + '" fill="none"/>';
  s += '<path d="M' + (250 - C.ftR) + ',' + C.paintD + ' A' + C.ftR + ',' + C.ftR + ' 0 0 0 ' + (250 + C.ftR) + ',' + C.paintD + '" fill="none"/>';
  s += '<path d="M' + (250 - C.ftR) + ',' + C.paintD + ' A' + C.ftR + ',' + C.ftR + ' 0 0 1 ' + (250 + C.ftR) + ',' + C.paintD + '" fill="none" stroke-dasharray="8 7"/>';
  s += '<path d="M' + C.cornerX + ',0 L' + C.cornerX + ',' + C.cornerY + ' A' + C.three + ',' + C.three + ' 0 0 0 ' + (C.w - C.cornerX) + ',' + C.cornerY + ' L' + (C.w - C.cornerX) + ',0" fill="none"/>';
  s += '<path d="M' + (250 - C.raR) + ',' + r + ' A' + C.raR + ',' + C.raR + ' 0 0 0 ' + (250 + C.raR) + ',' + r + '" fill="none" opacity=".7"/>';
  s += '<line x1="220" y1="40" x2="280" y2="40" stroke-width="3"/>';
  s += '<circle cx="250" cy="' + r + '" r="7.5" fill="none"/>';
  s += '<path d="M190,' + C.h + ' A60,60 0 0 1 310,' + C.h + '" fill="none"/>';
  s += '</g>' + (inner || "") + '</svg>';
  return s;
}

/* ---------- defaults ---------- */
/* The staff's own offensive triggers — the call that produced the shot.
   Editable in Setup; this is only what a fresh install starts with. */
const DEFAULT_PLAY_TYPES = ["CUT", "DRIVE", "INB", "ISO", "OFB", "ORB", "PNR BH", "PNR SC", "TRANS"];
/* Shown under the short form on the trigger buttons, where the short form is
   not self-explanatory. UI only — the short form is what gets stored. */
const PLAY_TYPE_FULL = {
  "OFB": "Off-ball screen",
  "ORB": "Off. rebound",
  "PNR BH": "Ball handler",
  "PNR SC": "Screener",
  "INB": "Inbounds",
  "TRANS": "Transition"
};
/* Keys for the Live tab's play-type step. Letters are safe here: inside the
   wizard, option keys are matched before any global shortcut, and "o" (flip
   offence) is the one letter the wizard intercepts first. */
const PT_KEYS = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "-", "=", "q", "w", "e", "a"];
/* Superseded default lists. A saved copy matching one of these exactly is
   upgraded on load, so no install is stranded on old names or an old order.
   A list the staff edited themselves matches none of these and is left alone. */
const LEGACY_PLAY_TYPES = [
  ["Transition", "PnR Ball Handler", "PnR Roll/Pop", "Spot Up", "Isolation",
    "Post Up", "Handoff", "Off Screen", "Cut", "Putback", "Misc"],   // Synergy defaults
  ["Drive", "Cut", "Fist", "Snap", "Slip", "Shark", "Hand",
    "Pin", "Cross", "Chest", "Rip", "ISO", "Punch", "ORB", "Misc"],  // same 15, unsorted
  ["Chest", "Cross", "Cut", "Drive", "Fist", "Hand", "ISO",
    "Misc", "ORB", "Pin", "Punch", "Rip", "Shark", "Slip", "Snap"],  // sorted, before Trans.
  ["Chest", "Cross", "Cut", "Drive", "Fist", "Hand", "ISO",
    "Misc", "ORB", "Pin", "Punch", "Rip", "Shark", "Slip", "Snap", "Trans."],
  ["CUT", "DRIVE", "INB", "ISO", "OFB", "PNR BH", "PNR SC", "TRANS"]   // before ORB came back
];

/* MacEwan Griffins 2026-27, from macewangriffins.ca, retrieved 2026-10-10.
   Ids are assigned when the roster is loaded, not stored here. */
const GRIFFINS_2026_27 = [
  ["0", "Owen Hickey", "G"], ["1", "Jojo Muyo", "PG"], ["2", "Khushal Shukla", "PG"],
  ["3", "Joel Seke", "W"], ["4", "Elisha Ampofo", "G"], ["5", "Diego Presingular", "PG"],
  ["6", "Noah Simon", "F"], ["7", "Judson Weir", "W"], ["8", "Dele Osuma", "W"],
  ["9", "Ryan Ziolkowski", "F"], ["10", "Wol Wol", "F"], ["11", "Favour Igbinyemi", "F"],
  ["12", "Abdi Musse", "G"], ["13", "Nathan Lefevre", "G"], ["14", "David Wilmes", "F"],
  ["15", "Otis Onink", "F"]
];
const griffinsRoster = () => GRIFFINS_2026_27.map(p => ({ id: uid(), num: p[0], name: p[1], pos: p[2] }));
const TO_KINDS = ["Bad pass", "Ball handling", "Offensive foul", "Travel / violation", "Shot clock", "Other"];

const DEFAULT_SETTINGS = {
  teamName: "Griffins",
  teamShort: "MAC",
  playTypes: DEFAULT_PLAY_TYPES.slice(),
  rimRadiusM: 1.5,
  foulOut: 5,
  bonusAt: 5,                 // FIBA: 5th team foul in a quarter → FTs
  stintWarnMin: 7,            // highlight stint length on player cards
  alert: { minChances: 8, lineupBad: -0.5, lineupGood: 0.5, ptMin: 3, ptGood: 3.0, ptBad: 2.0 },
  ai: { apiKey: "", model: "claude-opus-5-5", effort: "medium" }
};

/* ---------- persistence (localStorage, one key per game) ---------- */
const LS = { settings: "pqt.settings", roster: "pqt.roster", index: "pqt.games", current: "pqt.current", theme: "pqt.theme" };
const Store = {
  read(k, fb) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : fb; } catch (e) { return fb; } },
  write(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { console.warn("save failed", e); return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } },

  settings() {
    const s = Object.assign({}, JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), this.read(LS.settings, {}));
    s.alert = Object.assign({}, DEFAULT_SETTINGS.alert, s.alert || {});
    s.ai = Object.assign({}, DEFAULT_SETTINGS.ai, s.ai || {});
    if (!Array.isArray(s.playTypes) || !s.playTypes.length) s.playTypes = DEFAULT_PLAY_TYPES.slice();
    else if (LEGACY_PLAY_TYPES.some(l => l.join("|") === s.playTypes.join("|"))) s.playTypes = DEFAULT_PLAY_TYPES.slice();
    return s;
  },
  saveSettings(s) { this.write(LS.settings, s); },
  roster() { return this.read(LS.roster, []); },
  saveRoster(r) { this.write(LS.roster, r); },

  index() { return this.read(LS.index, []); },
  loadGame(id) { return this.read("pqt.game." + id, null); },
  saveGame(g) {
    g.updated = Date.now();
    this.write("pqt.game." + g.id, g);
    const idx = this.index().filter(x => x.id !== g.id);
    idx.unshift({ id: g.id, date: g.date, opp: g.opp.name, us: g.scoreCache ? g.scoreCache.us : 0, them: g.scoreCache ? g.scoreCache.them : 0, updated: g.updated });
    idx.sort((a, b) => (b.date || "").localeCompare(a.date || "") || b.updated - a.updated);
    this.write(LS.index, idx);
    this.write(LS.current, g.id);
  },
  deleteGame(id) {
    this.del("pqt.game." + id);
    this.write(LS.index, this.index().filter(x => x.id !== id));

async function askClaude({ S, history, question, context, onText, systemPrompt }) {
  if (!S.ai.apiKey) throw new Error("Add your Anthropic API key in Setup → AI assistant.");
  if (!navigator.onLine) throw new Error("This laptop is offline. The AI assistant needs internet; everything else keeps working.");
  let Anthropic;
  try { Anthropic = await loadAnthropic(); }
  catch (e) { throw new Error("Couldn't load the Claude SDK (check the internet connection)."); }

  const client = new Anthropic({ apiKey: S.ai.apiKey, dangerouslyAllowBrowser: true });
  const model = S.ai.model || "claude-opus-5-5";
  const messages = history.map(m => ({ role: m.role, content: m.content }));
  messages.push({ role: "user", content: "<game_data>\n" + context + "\n</game_data>\n\n" + question });

  const params = {
    model,
    max_tokens: 16000,
    system: [{ type: "text", text: systemPrompt || aiSystemPrompt(S), cache_control: { type: "ephemeral" } }],
    messages
  };

    // Haiku 4.5 still takes a thinking budget and rejects effort; the 5-series
    // models take adaptive thinking and an effort level instead.
    params.thinking = { type: "adaptive" };
    params.output_config = { effort: S.ai.effort || "medium" };
  }
  let stream;
  if (AI_FALLBACK_MODELS.indexOf(model) > -1) {
    // If a safety classifier declines, the API re-runs the same request on a
    // recommended model inside the same call rather than returning nothing.
    params.betas = ["server-side-fallback-2026-07-01"];
    params.fallbacks = "default";
    stream = client.beta.messages.stream(params);
  } else {
    stream = client.messages.stream(params);
  }
  stream.on("text", t => onText && onText(t));
  try {
    const msg = await stream.finalMessage();
    if (msg.stop_reason === "refusal") throw new Error("Claude declined this request. Try rephrasing the question.");
    return msg.content.filter(b => b.type === "text").map(b => b.text).join("");
  } catch (e) {
    if (Anthropic.AuthenticationError && e instanceof Anthropic.AuthenticationError) throw new Error("The API key was rejected. Check it in Setup → AI assistant.");
    if (Anthropic.RateLimitError && e instanceof Anthropic.RateLimitError) throw new Error("Rate limited by the API. Wait a few seconds and try again.");
    if (Anthropic.APIConnectionError && e instanceof Anthropic.APIConnectionError) throw new Error("Couldn't reach the Claude API. Check the internet connection.");
    if (Anthropic.APIError && e instanceof Anthropic.APIError) throw new Error("Claude API error " + (e.status || "") + ": " + e.message);
    throw e;
  }
}

<script>
/* ---- inlined from js/analysis.js ---- */
/* ============================================================
   analysis.js — in-game reads for the phone tracker.

   Two layers, and the split is deliberate:

   1. readsFor() is a rule engine that runs locally on every shot. It is
      instant, free, works with no signal, and every number in it is computed
      by code. This is the "live" part.
   2. askCoach() sends those already-computed numbers to Claude for the
      judgement a rule can't make. Claude never does arithmetic here: it reads
      a table the code produced and says what it would do about it.

   The thresholds come from the staff's own PQ matrix, not from invented league
   averages: mid-range is the only shot type that cannot grade above Silver, a
   rim or catch-and-shoot three is the only thing that grades Gold from the
   floor, and a heavy contest drops everything to Bronze.
   ============================================================ */

const GOOD_SHOT = ["rim", "three-cs"];        // the only Gold-capable field goals
const NO_GOLD = ["mid"];                      // cannot grade above Silver, ever

/* ---------- small helpers over the shot log ---------- */
function splitBy(list, keyFn) {
  const m = new Map();
  list.forEach(a => { const k = keyFn(a); if (k) (m.get(k) || m.set(k, []).get(k)).push(a); });
  return m;
}
const shareOf = (part, whole) => (whole ? part / whole : 0);

/* ---------- rebounding ----------
   Read from the glass after each miss: who came down with it, and what the
   offence did with the extra life. Rates are stated against the other team's
   share of the same glass rather than a league average — OREB% and the
   opponent's DREB% on the same misses are two halves of one number, so no
   outside benchmark is needed. */
function reboundStats(game, D, shooter) {
  const evs = game.events || [];
  const meta = (D && D.meta) || {};
  const pts = {};
  chances(game).forEach(c => (pts[c.id] = c.pts));

  let misses = 0, won = 0, lost = 0, second = 0;
  const byPlayer = {};
  let awaiting = null, live = false;   // live = a board of ours is keeping it alive

  evs.forEach(e => {
    if (e.type === "reb") {
      const off = meta[e.id] ? !!meta[e.id].off : awaiting === e.team;
      if (awaiting === shooter) {
        if (off) {
          won++;
          if (e.pl) byPlayer[e.pl] = (byPlayer[e.pl] || 0) + 1;
        } else lost++;
      }
      live = off && e.team === shooter;
      awaiting = null;
      return;
    }
    if (!isChance(e)) return;
    if (e.team !== shooter) { live = false; awaiting = null; return; }
    if (live) second += pts[e.id] || 0;
    if (needsRebound(e)) awaiting = shooter;
    else { awaiting = null; live = false; }
    if (needsRebound(e)) misses++;
  });

  const resolved = won + lost;
  return {
    misses: misses, resolved: resolved, won: won, lost: lost,
    pct: resolved ? won / resolved : null, second: second, byPlayer: byPlayer
  };
}

/* ---------- the rule engine ----------
   Returns reads sorted worst-first, each with the number behind it and an
   action. `w` is the sort weight: how far past the threshold it sits. */
function readsFor(game, D, S, team) {
  const A = Object.assign({ minChances: 8, ptMin: 3, ptGood: 3.0, ptBad: 2.0 }, S.alert || {});
  const allCh = chances(game).filter(a => a.team === team);
  const mine = allCh.filter(a => !a.isTO);     // shot attempts
  const out = [];
  if (allCh.length < 4) {
    return [{ level: "info", tag: "Sample", w: 0, title: "Not enough logged yet",
      detail: allCh.length + " chance" + (allCh.length === 1 ? "" : "s") + " so far.",
      action: "Reads start once there are a handful of chances to read." }];
  }
  const t = tally(mine);        // shot-only rates: diet, contest
  const tc = tally(allCh);      // PQ and points are per chance, as the matrix grades them
  const push = r => out.push(r);
  const n = x => fmt2(x);
  const mins = k => Math.max(1, k);

  /* --- 1. shot diet: what we are choosing, before whether it went in --- */
  const byType = {};
  TYPE_ORDER.forEach(k => (byType[k] = mine.filter(a => typeKey(a) === k)));
  const goodShots = mine.filter(a => GOOD_SHOT.indexOf(typeKey(a)) > -1).length;
  const goodRate = shareOf(goodShots, t.n);
  const midRate = shareOf(byType.mid.length, t.n);

  if (t.n >= A.minChances && midRate >= 0.25) {
    push({ level: "bad", tag: "Shot diet", w: (midRate - 0.25) * 10,
      title: Math.round(midRate * 100) + "% of our shots are mid-range",
      detail: byType.mid.length + " of " + t.n + " attempts · " + n(tally(byType.mid).pqAvg) + " PQ",
      action: team === "us"
        ? "Mid-range tops out at Silver and only when wide open. Drive it or kick it — one more pass turns these into rim or catch-and-shoot threes."
        : "They are settling. Keep walling the paint and running them off the line." });
  }
  if (t.n >= A.minChances && goodRate >= 0.6 && team === "us") {
    push({ level: "good", tag: "Shot diet", w: (goodRate - 0.6) * 6,
      title: Math.round(goodRate * 100) + "% of our shots are rim or catch-and-shoot threes",
      detail: goodShots + " of " + t.n + " attempts · " + n(t.pqAvg) + " PQ overall",
      action: "This is the shot diet you want. Keep the same actions going." });
  }
  if (t.n >= A.minChances && goodRate < 0.45 && team === "us") {
    push({ level: "bad", tag: "Shot diet", w: (0.45 - goodRate) * 8,
      title: "Only " + Math.round(goodRate * 100) + "% of our shots are Gold-capable looks",
      detail: goodShots + " rim or C&S 3 out of " + t.n + " attempts",
      action: "Nothing else on the floor can grade Gold. Hunt the rim first and spray out to standstill shooters." });
  }

  /* --- 2. contest: the single biggest lever on PQ --- */
  const contestedRate = shareOf(t.cont, t.n);
  if (t.n >= A.minChances && contestedRate >= 0.55) {
    push({ level: team === "us" ? "bad" : "good", tag: "Contest", w: (contestedRate - 0.55) * 8,
      title: (team === "us" ? "We are taking " : "They are taking ") + Math.round(contestedRate * 100) + "% contested",
      detail: t.cont + " of " + t.n + " attempts contested · contested shots grade Bronze 2 whatever they are",
      action: team === "us"
        ? "A contest drops every shot type to Bronze. Rescreen, swing it once more, or attack earlier in the clock."
        : "Our contest rate is the reason their PQ is down. Keep it up." });
  }
  const rim = byType.rim;
  if (rim.length >= A.ptMin) {
    const rimCont = shareOf(rim.filter(a => a.ct !== "open").length, rim.length);
    if (rimCont >= 0.5 && team === "us") {
      push({ level: "bad", tag: "At rim", w: rimCont * 3,
        title: Math.round(rimCont * 100) + "% of our rim attempts are contested",
        detail: rim.length + " rim attempts · " + n(tally(rim).pqAvg) + " PQ · " + pct(tally(rim).fgm, tally(rim).fga) + " FG",
        action: "An uncontested rim shot is Gold 4; a contested one is Bronze 2. Same shot, half the value — get a second cutter or a rescreen into it." });
    }
  }

  /* --- 3. triggers: what is actually producing --- */
  const byTrig = splitBy(allCh, a => a.pt && a.pt !== "Unknown" ? a.pt : null);
  const trig = Array.from(byTrig.entries()).map(([k, v]) => ({ k, t: tally(v) }))
    .filter(r => r.t.n >= A.ptMin);
  trig.sort((a, b) => b.t.pqAvg - a.t.pqAvg);
  if (trig.length) {
    const best = trig[0], worst = trig[trig.length - 1];
    if (best.t.pqAvg >= A.ptGood) {
      push({ level: "good", tag: "Trigger", w: (best.t.pqAvg - A.ptGood + 0.3),
        title: best.k + " is our best call at " + n(best.t.pqAvg) + " PQ",
        detail: best.t.n + " chances · " + n(best.t.ppa) + " pts/ch · " + pct(best.t.fgm, best.t.fga) + " FG" +
          (best.t.to ? " · " + best.t.to + " TO" : ""),
        action: team === "us" ? "Go back to it out of the timeout." : "They will come back to this. Game-plan it now." });
    }
    if (worst.t.pqAvg <= A.ptBad && worst.k !== best.k) {
      push({ level: "bad", tag: "Trigger", w: (A.ptBad - worst.t.pqAvg + 0.3),
        title: worst.k + " is producing " + n(worst.t.pqAvg) + " PQ",
        detail: worst.t.n + " chances · " + n(worst.t.ppa) + " pts/ch · " + pct(worst.t.fgm, worst.t.fga) + " FG" +
          (worst.t.to ? " · " + worst.t.to + " TO" : ""),
        action: team === "us" ? "Shelve it for a stretch, or change the entry into it." : "Make them run this one." });
    }
  }

  /* --- 4. process vs result: the read a box score cannot give --- */
  if (tc.n >= A.minChances) {
    const expected = tc.pqAvg, got = tc.ppa;
    if (expected >= 3.0 && got <= 1.0) {
      push({ level: "info", tag: "Variance", w: 1.5,
        title: "Good looks, nothing falling",
        detail: n(expected) + " PQ but only " + n(got) + " pts/chance · " + pct(t.fgm, t.fga) + " FG",
        action: "The process is right. Do not tear up the offence over a cold stretch — keep generating these." });
    } else if (expected <= 2.4 && got >= 1.3) {
      push({ level: "watch", tag: "Variance", w: 1.2,
        title: "Scoring despite the shot quality",
        detail: n(expected) + " PQ but " + n(got) + " pts/chance",
        action: "We are making tough ones. That usually regresses — get back to better looks before it does." });
    }
  }

  /* --- 4b. turnovers: a live-ball giveaway is the only chance worth zero --- */
  if (tc.n >= A.minChances && tc.to) {
    const toRate = tc.to / tc.n, live = tc.toLive, dead = tc.to - tc.toLive;
    const detail = tc.to + " of " + tc.n + " chances (" + live + " live, " + dead + " dead) · " +
      "a live-ball turnover grades 0, the only chance worth nothing";
    if (toRate >= 0.18) {
      push({ level: team === "us" ? "bad" : "good", tag: "Turnovers", w: (toRate - 0.18) * 12,
        title: (team === "us" ? "We are giving it away on " : "They are giving it away on ") +
          Math.round(toRate * 100) + "% of chances",
        detail: detail,
        action: team === "us"
          ? "Nothing drags PQ down faster. Simplify the entry, get it out of the middle of the floor, and take the first clean pass."
          : "Keep forcing it — these are the cheapest stops we are getting." });
    } else if (live >= 3 && live / tc.n >= 0.10) {
      push({ level: team === "us" ? "watch" : "good", tag: "Turnovers", w: live / tc.n * 6,
        title: live + " live-ball turnovers",
        detail: detail,
        action: team === "us"
          ? "Live balls run the other way. Dead-ball mistakes we can live with; these are the ones to cut."
          : "Their live-ball giveaways are our transition — keep pressuring the catch." });
    }

  const rb = reboundStats(game, D, team);
  const cov = rebCoverage(game);

    const share = Math.round(rb.pct * 100);
    const who = ours ? "We are" : "They are";
    const detail = rb.won + " offensive boards from " + rb.resolved + " live misses · " +
      rb.second + " second-chance point" + (rb.second === 1 ? "" : "s");
    if (rb.pct >= 0.35) {
      push({ level: ours ? "good" : "bad", tag: "Glass", w: (rb.pct - 0.35) * 8 + rb.second * 0.1,
        title: who + " getting " + share + "% of " + (ours ? "our" : "their") + " misses back",
        detail: detail,
        action: ours
          ? "Extra possessions are free offence. Keep sending the same bodies and make sure the guard gets back."
          : "This is the cheapest thing to fix: find a body on every shot. Those second-chance points cost nothing to give up and nothing to stop." });
    } else if (rb.pct <= 0.15) {
      push({ level: ours ? "watch" : "good", tag: "Glass", w: (0.15 - rb.pct) * 6 + 0.5,
        title: who + " getting only " + share + "% of " + (ours ? "our" : "their") + " misses back",
        detail: detail,

          : "We are finishing possessions. That is the defence doing its last job properly." });

  if (ours && rb.won >= 3) {
    const top = Object.keys(rb.byPlayer).sort((a, b) => rb.byPlayer[b] - rb.byPlayer[a])[0];
    if (top && rb.byPlayer[top] >= 2 && rb.byPlayer[top] / rb.won >= 0.4) {
      push({ level: "info", tag: "Glass", w: rb.byPlayer[top] * 0.4,
        title: pnameOf(game, top) + " is creating the extra possessions",
        detail: rb.byPlayer[top] + " of our " + rb.won + " offensive boards",
        action: "Worth keeping him on the floor in stretches where we need a second shot." });
    }
  }
  if (cov.need >= 5 && cov.ratio < 0.8) {
    push({ level: "info", tag: "Glass", w: 0.4,
      title: "Rebounding numbers are partial",
      detail: cov.got + " of " + cov.need + " misses have a board logged (" + Math.round(cov.ratio * 100) + "%)",
      action: "Log the board after each miss and the rebounding reads — and points per possession — turn on." });
  }

  /* --- 4d. the matchup: what each of ours is giving up --- */
  if (team === "them") {
    const guarded = allCh.filter(a => a.dfn);
    if (guarded.length >= A.minChances) {
      const byD = splitBy(guarded, a => a.dfn);
      const rows = Array.from(byD.entries()).map(([k, v]) => ({ k, t: tally(v) }))
        .filter(r => r.t.n >= A.ptMin);
      if (rows.length >= 2) {
        rows.sort((a, b) => b.t.ppa - a.t.ppa);
        const worst = rows[0], best = rows[rows.length - 1];
        if (worst.t.ppa - best.t.ppa >= 0.5) {
          push({ level: "bad", tag: "Matchup", w: worst.t.ppa,
            title: pnameOf(game, worst.k) + " is giving up " + n(worst.t.ppa) + " points a chance",
            detail: worst.t.n + " chances guarded · " + pct(worst.t.fgm, worst.t.fga) + " FG allowed · " +
              n(worst.t.pqAvg) + " PQ allowed",
            action: "Switch the matchup, send early help, or put " + pnameOf(game, best.k) +
              " on him — he is giving up " + n(best.t.ppa) + " a chance." });
        }
      }
    }
  }

  /* --- 5. quarter trend --- */
  const byQ = splitBy(allCh, a => String(a.p));
  const qs = Array.from(byQ.keys()).map(Number).sort((a, b) => a - b);
  if (qs.length >= 2) {
    const last = qs[qs.length - 1], prev = qs[qs.length - 2];
    const lt = tally(byQ.get(String(last))), pt = tally(byQ.get(String(prev)));
    if (lt.n >= A.ptMin && pt.n >= A.ptMin) {
      const drop = pt.pqAvg - lt.pqAvg;
      if (Math.abs(drop) >= 0.6) {
        const worse = drop > 0;
        push({ level: worse ? (team === "us" ? "bad" : "good") : (team === "us" ? "good" : "watch"),
          tag: "Trend", w: Math.abs(drop),
          title: periodName(last) + " shot quality is " + (worse ? "down" : "up") + " on " + periodName(prev),
          detail: periodName(prev) + " " + n(pt.pqAvg) + " PQ → " + periodName(last) + " " + n(lt.pqAvg) + " PQ",
          action: worse
            ? "Something changed between quarters — check what they switched to and what we stopped running."
            : "Whatever changed this quarter is working." });
      }
    }
  }

  /* --- 6. five-man groups (our lineups only; we do not track theirs) --- */
  if (D && D.meta) {
    const byFive = splitBy(allCh, a => lineupKey(a));
    const fives = Array.from(byFive.entries()).map(([k, v]) => ({ k, t: tally(v) }))
      .filter(r => r.t.n >= Math.max(4, A.ptMin + 1));
    if (fives.length >= 2) {
      fives.sort((a, b) => b.t.pqAvg - a.t.pqAvg);
      const best = fives[0], worst = fives[fives.length - 1];
      const label = k => lineupLabel(k);
      if (best.t.pqAvg - worst.t.pqAvg >= 0.7) {
        push({ level: "info", tag: "Lineup", w: best.t.pqAvg - worst.t.pqAvg,
          title: (team === "us" ? "Best five on offence: " : "Best five defensively: ") + label(best.k),
          detail: n(best.t.pqAvg) + " PQ over " + best.t.n + " attempts · worst is " + label(worst.k) + " at " + n(worst.t.pqAvg),
          action: team === "us"
            ? "Worth a longer look at the top group if the matchup allows."
            : "Their numbers are against our five — the top group here is holding up best." });
      }
    }
  }

  /* --- 7. shooters --- */
  const byPl = splitBy(allCh, a => a.pl);
  const pls = Array.from(byPl.entries()).map(([k, v]) => ({ k, t: tally(v) })).filter(r => r.t.n >= A.ptMin);
  if (pls.length >= 2 && team === "us") {
    pls.sort((a, b) => b.t.pqAvg - a.t.pqAvg);
    const cold = pls[pls.length - 1];
    if (cold.t.pqAvg <= A.ptBad) {
      push({ level: "watch", tag: "Shooter", w: (A.ptBad - cold.t.pqAvg),
        title: pnameOf(game, cold.k) + " is taking low-quality shots",
        detail: cold.t.n + " attempts at " + n(cold.t.pqAvg) + " PQ · " + pct(cold.t.fgm, cold.t.fga) + " FG",
        action: "Not a scoring problem — a shot-selection one. Get him catching on the move instead of creating late." });
    }
  }

  const rank = { bad: 3, watch: 2, info: 1, good: 0 };
  out.sort((a, b) => rank[b.level] - rank[a.level] || b.w - a.w);
  return out;
}

/* ---------- the pack handed to Claude ----------
   Only what this tracker actually records, and an explicit list of what it
   does not, so the model never reasons from a zero that means "not tracked". */
function coachContext(game, D, S) {
  const L = [], us = S.teamName || "Us", them = game.opp.name;
  const all = chances(game);
  const cov0 = rebCoverage(game);
  const line = (label, t) => "| " + label + " | " + t.n + " | " + (t.to || 0) + " | " + t.fgm + "-" + t.fga + " | " +
    pct(t.fgm, t.fga) + " | " + fmt2(t.pqAvg) + " | " + fmt2(t.ppa) + " | " +
    (t.contRate == null ? "-" : Math.round(t.contRate * 100) + "%") + " |";
  const head = what => ["| " + what + " | Chances | TO | FG | FG% | PQ | Pts/ch | Contested |",
    "|---|---|---|---|---|---|---|---|"];

  L.push("# Situation");
  L.push(us + " " + score(game).us + " – " + score(game).them + " " + them +
    " · " + periodName(game.clock.period) + " " + fmtClock(game.clock.remaining) + " left · " + game.date);
  L.push("On the floor: " + ((D && D.lineup || []).map(id => pnameOf(game, id)).join(", ") || "not set"));

  L.push("");
  L.push("# What this log contains, and what it does not");
  L.push("Every row below counts CHANCES: shot attempts, shooting fouls, and turnovers, each graded by the staff's PQ matrix at the moment it happened.");
  L.push("TRACKED: shooter, offensive trigger, shot type, contested or not, outcome, court location, quarter, the five on the floor, turnovers split into live-ball and dead-ball, rebounds (an offensive board names the player; a defensive one is credited to the team), and on their shots which of ours was guarding.");
  L.push("NOT TRACKED: assists, steals, blocks, deflections. Do not comment on them and do not treat a missing number as a zero.");
  L.push(cov0.ratio >= 0.8
    ? "Rebounds are logged on " + cov0.got + " of " + cov0.need + " live misses, so possessions and points per possession are reliable."
    : "Only " + cov0.got + " of " + cov0.need + " live misses have a rebound logged, so DO NOT quote points per possession — the possession count merges trips together. Use points per chance.");
  L.push("PQ is a 0-4 grade of the chance, not the result: Gold 4 (uncontested rim, wide-open catch-and-shoot 3, free-throw trip), Silver 3 (uncontested paint, uncontested mid, uncontested off-the-dribble 3), Bronze 2 (anything contested), 1 (dead-ball turnover), 0 (live-ball turnover).");

  ["us", "them"].forEach(team => {
    const mine = all.filter(a => a.team === team);
    if (!mine.length) return;
    const name = team === "us" ? us : them;
    L.push("");
    L.push("# " + name + (team === "us" ? " offence" : " offence (what our defence allowed)"));
    L.push.apply(L, head("Total"));
    L.push(line("All attempts", tally(mine)));

    const tt = tally(mine);
    if (tt.to) L.push("Turnovers: " + tt.to + " (" + tt.toLive + " live-ball, " + (tt.to - tt.toLive) + " dead-ball).");
    const rb = reboundStats(game, D, team);
    if (rb.resolved) {
      L.push("Glass: " + rb.won + " offensive boards from " + rb.resolved + " live misses (" +
        Math.round(rb.pct * 100) + "%), " + rb.second + " second-chance points.");
    }
    if (cov0.ratio >= 0.8 && D && D.poss) {
      const ps = D.poss.filter(p => p.team === team);
      if (ps.length) {
        const pp = ps.reduce((n, p) => n + (p.pts || 0), 0);
        L.push("Possessions: " + ps.length + " for " + pp + " points (" + fmt2(pp / ps.length) + " per possession).");
      }
    }

    L.push("");
    L.push("## " + name + " by shot type (shot attempts only — a turnover has no shot type)");
    L.push.apply(L, head("Shot type"));
    TYPE_ORDER.forEach(k => {
      const v = mine.filter(a => !a.isTO && typeKey(a) === k);
      if (v.length) L.push(line(TYPE_LABEL[k], tally(v)));
    });

    L.push("");
    L.push("## " + name + " by offensive trigger");
    L.push.apply(L, head("Trigger"));
    const byT = splitBy(mine, a => a.pt || "Unknown");
    Array.from(byT.entries()).sort((a, b) => b[1].length - a[1].length)
      .forEach(([k, v]) => L.push(line(k, tally(v))));

    L.push("");
    L.push("## " + name + " by quarter");
    L.push.apply(L, head("Quarter"));
    Array.from(splitBy(mine, a => String(a.p)).entries())
      .sort((a, b) => +a[0] - +b[0])
      .forEach(([k, v]) => L.push(line(periodName(+k), tally(v))));
  });

  const guarded = all.filter(a => a.team === "them" && a.dfn);
  if (guarded.length) {
    L.push("");
    L.push("# What each of ours gave up (defender logged on " + guarded.length + " of their chances)");
    L.push("| Guarded by | Chances | FG | FG% | PQ allowed | Pts/ch |");
    L.push("|---|---|---|---|---|---|");
    Array.from(splitBy(guarded, a => a.dfn).entries())
      .sort((a, b) => b[1].length - a[1].length)
      .forEach(([id, v]) => {
        const t = tally(v);
        L.push("| " + pnameOf(game, id) + " | " + t.n + " | " + t.fgm + "-" + t.fga + " | " +
          pct(t.fgm, t.fga) + " | " + fmt2(t.pqAvg) + " | " + fmt2(t.ppa) + " |");
      });
  }

  const ours = all.filter(a => a.team === "us");
  if (ours.length) {
    L.push("");
    L.push("# " + us + " shooters");
    L.push("| Player | Min | Chances | TO | FG | FG% | PQ | Pts/ch |");
    L.push("|---|---|---|---|---|---|---|---|");
    Array.from(splitBy(ours, a => a.pl).entries()).forEach(([id, v]) => {
      const t = tally(v);
      L.push("| " + pnameOf(game, id) + ((D && D.lineup || []).indexOf(id) > -1 ? " (on)" : "") +
        " | " + fmtMin(minutesOf(id)) + " | " + t.n + " | " + (t.to || 0) + " | " + t.fgm + "-" + t.fga + " | " +
        pct(t.fgm, t.fga) + " | " + fmt2(t.pqAvg) + " | " + fmt2(t.ppa) + " |");
    });

    const fives = Array.from(splitBy(ours, a => lineupKey(a)).entries()).filter(e => e[0]);
    if (fives.length) {
      L.push("");
      L.push("# " + us + " five-man groups (offence)");
      L.push("| Five | Chances | TO | FG% | PQ | Pts/ch |");
      L.push("|---|---|---|---|---|---|");
      fives.sort((a, b) => b[1].length - a[1].length).forEach(([k, v]) => {
        const t = tally(v);
        L.push("| " + lineupLabel(k) + " | " + t.n + " | " + (t.to || 0) + " | " + pct(t.fgm, t.fga) + " | " + fmt2(t.pqAvg) + " | " + fmt2(t.ppa) + " |");
      });
    }
  }

  L.push("");
  L.push("# Last 10 chances (oldest first)");
  all.slice(-10).forEach(a => {
    const when = periodName(a.p) + " " + fmtClock(a.ev.c).replace(/\.\d$/, "") + " · " +
      (a.team === "us" ? us : them) + " · " + (a.pl ? pnameOf(game, a.pl) : "—") + " · " + a.pt + " · ";
    L.push("- " + when + (a.isTO
      ? (a.toKind === "Offensive foul" ? "offensive foul" : a.live ? "live-ball turnover" : "dead-ball turnover")
      : (TYPE_LABEL[typeKey(a)] || a.cls) + " · " + (a.ct === "open" ? "uncontested" : "contested") +
        " · " + { make: "make", miss: "miss", and1: "and-1", foul: "shooting foul" }[a.kind]) +
      " · " + tierOf(a.grade).name);
  });

  const reads = readsFor(game, D, S, "us").concat(readsFor(game, D, S, "them"));
  if (reads.length) {
    L.push("");
    L.push("# Rule-based reads already firing (computed by code, shown to the staff)");
    reads.slice(0, 10).forEach(r => L.push("- [" + r.level + "] " + r.tag + ": " + r.title + " (" + r.detail + ")"));
  }
  return L.join("\n");
}

/* ---------- the analyst ---------- */
function coachSystemPrompt(S) {
  return [
    "You are a senior basketball analyst on the bench with the " + (S.teamName || "team") +
    " staff during a live U Sports game (Canada West, FIBA rules, 10-minute quarters). You have coached, and you read a game the way a head coach does, not the way a spreadsheet does.",
    "",
    "The staff grade every chance with Possession Quality (PQ), 0-4: Gold 4 is an uncontested rim shot, a wide-open catch-and-shoot three, or a trip to the line; Silver 3 is an uncontested paint shot, mid-range or off-the-dribble three; Bronze 2 is anything contested; 1 is a dead-ball turnover; 0 is a live-ball turnover. PQ grades the CHANCE, not the result.",
    "",
    "How to answer:",
    "- They read this in a 60-second timeout. Lead with the call, then the number behind it. Three or four short bullets, plain language, no tables.",
    "- Be concrete and coachable. \"Rescreen the PNR BH and hunt the short roll\" beats \"improve shot selection\".",
    "- Separate process from result. High PQ with low points means the looks are right and the ball is not falling — say so, and say not to abandon it. Low PQ with high points means we are getting away with something.",
    "- Samples are tiny. Under about 8 attempts, say so rather than dressing it up. Never rank things that are separated by one or two shots.",
    "- Turnovers and rebounds ARE tracked. A dead-ball giveaway grades 1 and a live-ball giveaway 0, the only chance worth nothing. Offensive boards name the player; defensive boards are credited to the team. Assists, steals and blocks are NOT tracked — never comment on them and never treat an absent stat as zero.",
    "- Quote points per possession only when the data says rebound coverage is high enough; the pack tells you. Otherwise use points per chance, because unlogged boards merge separate trips into one.",
    "- Do not recompute or restate totals. The arithmetic is already done; your job is the judgement.",
    "- No preamble, no sign-off, no praise for the question."
  ].join("\n");
}

const COACH_PRESETS = [
  { k: "now", label: "What now?", q: "We are in a timeout. What are the two or three most important things to change or keep doing right now?" },
  { k: "lineup", label: "Lineup call", q: "Who should be on the floor for the next stretch, and why? Use the five-man and per-player numbers, and say what you are trading off." },
  { k: "offence", label: "Offence", q: "What should we be hunting on offence? Name the triggers to go back to and the ones to shelve, and the shots we should be getting instead." },
  { k: "defence", label: "Defence", q: "What is the opponent generating against us, and what one adjustment would you make to take it away?" },
  { k: "quarter", label: "Quarter review", q: "Review the quarter just finished: what changed, what worked, and the two adjustments for the next one." }
];

/* Streams a coaching read. All arithmetic is already in `context`; Claude
   supplies judgement only. */
async function askCoach({ S, game, D, question, history, onText }) {
  const context = coachContext(game, D, S);
  return askClaude({
    S, history: history || [], question, context, onText,
    systemPrompt: coachSystemPrompt(S)
  });
}

</script>
<script>
/* ---- inlined from js/shots.js ---- */
/* ============================================================
   shots.js — phone shot-logging surface for the PQ Game Tracker.

   Logs the four shot outcomes against a tapped court spot and writes the
   SAME event objects as the laptop Live tab, into the SAME pqt.game.*
   records — so whatever the phone logs, the laptop app opens and grades.

   Deliberately narrower than the Live tab: shots only. No running clock,
   no rebounds, no lineups, no turnovers. That means per-ATTEMPT numbers
   (PQ, FG%, points per attempt) are exact, while possession-level PPP is
   not — it needs rebounds to know when a possession ended.
   ============================================================ */

const App = { S: null, game: null, D: null, team: "us", tab: "track", wiz: null, sub: null, reb: null, edit: null, quick: null, F: {}, _toast: 0,
  sync: { status: "off", msg: "", timer: 0, busy: false, fails: 0 } };

/* phone-only settings, stored alongside the laptop's in pqt.settings */
const PHONE_DEFAULTS = { logFT: true, logDef: true, contest3: false, stickyPT: null, apiBase: "", apiToken: "", autoSync: true };
function phoneS() {
  const s = Store.settings();                 // laptop settings, defaults merged
  for (const k in PHONE_DEFAULTS) if (s[k] === undefined) s[k] = PHONE_DEFAULTS[k];
  return s;
}

/* ---------- shot-level reads over the event log ---------- */
/* Every graded shot attempt: a "shot" event, or an "ft" event carrying shot
   context (a shooting foul that drew no basket — the phone records where it
   happened, which the laptop's FT trip does not). */
function isChance(e) {
  return e.type === "shot" || (e.type === "ft" && e.cls) || e.type === "to";
}
/* Every graded chance in event order: shot attempts, shooting fouls, and
   turnovers. PQ is an average over CHANCES, the same unit the laptop grades,
   so a turnover drags it down exactly as the staff's matrix says it should
   (live-ball 0, dead-ball 1). */
function chances(game) {
  return (game.events || []).filter(isChance).map(e => (e.type === "to" ? turnoverFrom(e) : attemptFrom(e)));
}
/* Shot attempts only — what a shot chart, FG% or a shot-type split is about. */
function attempts(game) {
  return chances(game).filter(c => !c.isTO);
}
function turnoverFrom(e) {
  return {
    ev: e, id: e.id, team: e.team, p: e.p, pl: e.pl, pt: e.pt || "Unknown",
    isTO: true, live: !!e.live, toKind: e.kind || null, dfn: null,
    kind: e.live ? "to_live" : "to_dead",
    cls: e.cls || null, zone: e.zone || null, st: null, ct: null, three: false,
    x: e.x, y: e.y,
    fga: 0, fgm: 0, tpa: 0, tpm: 0, ftm: 0, fta: 0, ftUnknown: false, pts: 0,
    grade: e.pqOverride != null ? e.pqOverride : gradeTO(e.live)
  };
}
function attemptFrom(e) {
  return [e].map(e => {
    const three = e.cls === "three";
    const isShot = e.type === "shot";
    const made = isShot && !!e.made;
    const ftm = isShot ? (e.and1 && e.ftMade ? 1 : 0) : ((e.seq || "").match(/M/g) || []).length;
    const fta = isShot ? (e.and1 ? 1 : 0) : (e.seq || "").length;
    return {
      ev: e, id: e.id, team: e.team, p: e.p, pl: e.pl, pt: e.pt || "Unknown",
      isTO: false, live: false, toKind: null, dfn: e.dfn || null,
      cls: e.cls, zone: e.zone, st: e.st || null, ct: e.ct, x: e.x, y: e.y, three,
      kind: isShot ? (e.and1 ? "and1" : made ? "make" : "miss") : "foul",
      fga: isShot ? 1 : 0, fgm: made ? 1 : 0, tpa: isShot && three ? 1 : 0, tpm: made && three ? 1 : 0,
      ftm, fta, ftUnknown: !!e.ftUnknown,
      pts: (made ? (three ? 3 : 2) : 0) + ftm,
      grade: e.pqOverride != null ? e.pqOverride : (isShot ? gradeShot(e.cls, e.st, e.ct) : GRADE_FT)
    };
  })[0];
}
/* `n` counts whatever was passed in — attempts for a shot split, chances for a
   PQ split — so rates that only make sense over shots divide by `shots`. */
function tally(list) {
  const t = { n: 0, shots: 0, to: 0, toLive: 0, fga: 0, fgm: 0, tpa: 0, tpm: 0, ftm: 0, fta: 0, pts: 0, pq: 0, gold: 0, cont: 0, ftUnk: 0 };
  list.forEach(a => {
    t.n++;
    if (a.isTO) { t.to++; if (a.live) t.toLive++; } else t.shots++;
    t.fga += a.fga; t.fgm += a.fgm; t.tpa += a.tpa; t.tpm += a.tpm;
    t.ftm += a.ftm; t.fta += a.fta; t.pts += a.pts; t.pq += a.grade;
    if (a.grade === 4) t.gold++;
    if (a.ct === "heavy" || a.ct === "light") t.cont++;
    if (a.ftUnknown) t.ftUnk++;
  });
  t.pqAvg = t.n ? t.pq / t.n : null;
  t.fgPct = t.fga ? t.fgm / t.fga : null;
  t.efg = t.fga ? (t.fgm + 0.5 * t.tpm) / t.fga : null;
  t.ppa = t.n ? t.pts / t.n : null;
  t.contRate = t.shots ? t.cont / t.shots : null;
  t.toRate = t.n ? t.to / t.n : null;
  return t;
}
const score = g => { const A = attempts(g); return { us: tally(A.filter(a => a.team === "us")).pts, them: tally(A.filter(a => a.team === "them")).pts }; };
const myChances = () => chances(App.game).filter(c => c.team === App.team);
const roster = (g, t) => (t === "us" ? g.us.roster : g.opp.roster) || [];
const pnameOf = (g, id) => { const p = roster(g, "us").concat(roster(g, "them")).find(x => x.id === id); return p ? ("#" + p.num + " " + (p.name || "")).trim() : "—"; };
const teamLbl = t => (t === "us" ? App.S.teamShort : App.game.opp.short);
/* Under a big jersey number, a surname identifies a player faster than a
   first name cut off mid-word. */
const lastName = n => String(n || "").trim().split(/\s+/).pop() || "";

/* ---------- clock ----------
   The same shape and arithmetic as the laptop's, so one game reads correctly
   in both: clock.remaining is the settled value, and while it runs the live
   time is computed from startRemaining and startedAt. */
function clockNow() {
  const c = App.game.clock;
  if (!c.running) return Math.max(0, c.remaining);
  return Math.max(0, c.startRemaining - (Date.now() - c.startedAt) / 1000);
}
function nowGs() { return gameSec(App.game.clock.period, clockNow()); }
function toggleClock() {
  const c = App.game.clock;
  if (c.running) { c.remaining = clockNow(); c.running = false; }
  else { if (c.remaining <= 0) return; c.startRemaining = c.remaining; c.startedAt = Date.now(); c.running = true; }
  save(); renderBar();
}
function setClockTo(sec) {
  const c = App.game.clock;
  c.remaining = clamp(sec, 0, periodLen(c.period));
  c.startRemaining = c.remaining; c.startedAt = Date.now();
  save(); renderBar();
}
let _clockSaved = 0;
setInterval(() => {
  if (!App.game) return;
  const c = App.game.clock;
  if (!c.running) return;
  const t = clockNow();
  const btn = $("#clkBtn");
  if (btn) btn.textContent = fmtClock(t);
  if (t <= 0) {

/* End the quarter. Writes the laptop's period_end event, which closes the open

  catch (e) { App.D = { lineup: [], box: {}, meta: {}, stints: [] }; }
}
const onFloor = () => (App.D && App.D.lineup) || [];

/* ---------- boot ---------- */
function boot() {

  catch (err) {
    /* Never leave a coach looking at a dead screen mid-game. */
    const hint = document.getElementById("courtHint");
    if (hint) hint.innerHTML = "<b>Something went wrong starting up:</b> " +
      esc(String(err && err.message || err)) + ". Reload the page; logged shots are saved.";
    throw err;

}
function start() {
  App.S = phoneS();
  const id = Store.currentId();
  App.game = (id && Store.loadGame(id)) || null;
  if (!App.game) {
    const idx = Store.index();
    if (idx.length) App.game = Store.loadGame(idx[0].id);
  }
  if (!Store.roster().length) Store.saveRoster(griffinsRoster());
  if (!App.game) App.game = seedDemo();
  if (!App.game.opp.roster) App.game.opp.roster = [];
  /* A clock left running is paused on load rather than wound forward: the
     page may have been shut in a pocket for an hour, and clock.remaining was
     settled to storage a few seconds before it closed. */
  if (App.game.clock.running) { App.game.clock.running = false; Store.saveGame(App.game); }
  recompute();
  wire();
  renderAll();

  /* Start the sync loop: catch up on anything this device still owes, then
     keep the current game pushed. */
  if (syncEnabled()) { setSync("pending", "Checking…"); scheduleSync(1500); }
  else setSync(syncBase() ? "paused" : "off", "");
  if (typeof window !== "undefined" && window.addEventListener) {
    window.addEventListener("online", () => { App.sync.fails = 0; scheduleSync(500); });
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) scheduleSync(500);     // back on screen, catch up
    });
  }
}

  App.game.scoreCache = score(App.game);

/* ---------- commit / undo ---------- */
/* `atClock` is the clock reading when the coach tapped the floor. Without it a
   chance is stamped at the END of the decision tree, several real seconds later. */
function commitEv(ev, atClock) {
  ev.id = uid();
  ev.p = App.game.clock.period;
  ev.c = atClock != null ? atClock : Math.round(clockNow() * 10) / 10;
  App.game.events.push(ev);
  save();
}
/* Undo removes the last thing logged, whatever it was — a shot, a sub or the
   end of a quarter — so it always matches the line shown beside the button. */
function undoLast() {
  const evs = App.game.events;
  if (!evs.length) return;
  const ev = evs.pop();
  if (ev.type === "period_end") {
    const c = App.game.clock;
    c.period = ev.p; c.remaining = ev.c; c.startRemaining = ev.c;
    c.startedAt = Date.now(); c.running = false;

}

function describeEvent(ev) {
  const num = id => { const p = playerById(id); return p ? "#" + p.num : "?"; };
  if (ev.type === "period_end") return "the end of " + periodName(ev.p);
  if (ev.type === "to") {
    const who = ev.pl ? pnameOf(App.game, ev.pl) : teamLbl(ev.team);
    const how = ev.kind === "Offensive foul" ? "offensive foul" : ev.live ? "live-ball TO" : "dead-ball TO";
    return who + " · " + how;
  }
  if (ev.type === "foul") {
    return (ev.pl ? pnameOf(App.game, ev.pl) : teamLbl(ev.team)) + " \u00b7 foul";
  }
  if (ev.type === "timeout") return teamLbl(ev.team) + " \u00b7 timeout";
  if (ev.type === "reb") {
    const m = App.D && App.D.meta && App.D.meta[ev.id];
    return (ev.pl ? pnameOf(App.game, ev.pl) : teamLbl(ev.team)) + " \u00b7 " +
      (m ? (m.off ? "offensive " : "defensive ") : "") + "rebound";
  }
  if (ev.type === "sub") {
    const outs = ev.out || [], ins = ev.in || [];
    if (outs.length && ins.length) return "the sub " + num(ins[0]) + " for " + num(outs[0]);
    if (ins.length) return num(ins[0]) + " going on";
    if (outs.length) return num(outs[0]) + " coming off";
    return "a substitution";
  }
  const z = zoneById(ev.zone);
  const res = ev.type === "ft" ? "Foul" : ev.and1 ? "And-1" : ev.made ? "Make" : "Miss";
  return (ev.pl ? pnameOf(App.game, ev.pl) : teamLbl(ev.team)) + " · " +

}
function toast(msg) {
